---
- name: Ensure Windows service is running and log action to Event Log
  hosts: "{{ hostname }}"
  gather_facts: no
  vars:
    service_name: "{{ service_name }}"
    event_source: "{{ event_source | default('iAutomateServiceMonitor') }}"
    status_code: 2
    response_message: "Initialization"

  tasks:
    - name: Validate required variables
      assert:
        that:
          - service_name is defined
          - service_name | length > 0
        fail_msg: "The 'service_name' variable is required and cannot be empty."
        success_msg: "Required variables are present."

    - name: Check current status of the Windows service
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: service_info
      failed_when: false

    - name: Fail if service does not exist
      when: service_info.failed | default(false) or service_info.services is not defined or service_info.services | length == 0
      block:
        - name: Set failure message for non-existent service
          set_fact:
            status_code: 2
            response_message: "Service '{{ service_name }}' not found on host '{{ inventory_hostname }}'."
        - name: Log failure to Windows Event Log - service not found
          ansible.windows.win_eventlog:
            log: Application
            source: "{{ event_source }}"
            event_id: 1001
            level: Error
            message: "{{ response_message }}"
          ignore_errors: true
        - name: Fail play explicitly for non-existent service
          fail:
            msg: "{{ response_message }}"

    - name: Determine if service is already running
      set_fact:
        service_current_state: "{{ service_info.services[0].state | default('unknown') }}"

    - name: Service is already running - set success result
      when: service_current_state == 'running'
      block:
        - name: Set success message for already running service
          set_fact:
            status_code: 1
            response_message: "Service '{{ service_name }}' is already running on host '{{ inventory_hostname }}'."
        - name: Log info to Windows Event Log - already running
          ansible.windows.win_eventlog:
            log: Application
            source: "{{ event_source }}"
            event_id: 1002
            level: Information
            message: "{{ response_message }}"
          ignore_errors: true

    - name: Start the service if it is not running
      when: service_current_state != 'running'
      block:
        - name: Attempt to start the Windows service
          ansible.windows.win_service:
            name: "{{ service_name }}"
            state: started
          register: service_start_result
          failed_when: false

        - name: Handle service start failure
          when: service_start_result is failed or (service_start_result.state is defined and service_start_result.state != 'running')
          block:
            - name: Set failure message for service start
              set_fact:
                status_code: 2
                response_message: >-
                  Failed to start service '{{ service_name }}' on host '{{ inventory_hostname }}'.
                  Error: {{ service_start_result.msg | default('Unknown error') }}
            - name: Log failure to Windows Event Log - start failed
              ansible.windows.win_eventlog:
                log: Application
                source: "{{ event_source }}"
                event_id: 1003
                level: Error
                message: "{{ response_message }}"
              ignore_errors: true
            - name: Fail play explicitly for service start failure
              fail:
                msg: "{{ response_message }}"

        - name: Service started successfully - set success result
          when: service_start_result is succeeded or (service_start_result.state is defined and service_start_result.state == 'running')
          block:
            - name: Set success message for started service
              set_fact:
                status_code: 1
                response_message: "Service '{{ service_name }}' was stopped and has been started successfully on host '{{ inventory_hostname }}'."
            - name: Log info to Windows Event Log - start success
              ansible.windows.win_eventlog:
                log: Application
                source: "{{ event_source }}"
                event_id: 1004
                level: Information
                message: "{{ response_message }}"
              ignore_errors: true

    - name: Final result
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"