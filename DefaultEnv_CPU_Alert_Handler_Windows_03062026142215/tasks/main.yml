---
- name: Restart IIS on a Windows server when CPU is above threshold
  hosts: "{{ hostname }}"
  gather_facts: no
  vars:
    cpu_threshold: "{{ cpu_threshold | default(90) | int }}"
    check_interval_seconds: "{{ check_interval_seconds | default(60) | int }}"
    sample_count: "{{ sample_count | default(6) | int }}"
    iis_service_name: "{{ iis_service_name | default('W3SVC') }}"
    status_code: 0
    response_message: ""

  tasks:
    - name: Validate numeric parameters
      assert:
        that:
          - cpu_threshold >= 1 and cpu_threshold <= 100
          - check_interval_seconds > 0
          - sample_count > 0
        fail_msg: "Invalid parameters: ensure cpu_threshold (1-100), check_interval_seconds (>0), sample_count (>0)."
        success_msg: "Parameters validated successfully."

    - name: Initialize CPU high flag
      set_fact:
        cpu_high_detected: false

    - name: Check CPU usage over time
      win_shell: |
        $threshold = {{ cpu_threshold }}
        $interval = {{ check_interval_seconds }}
        $samples = {{ sample_count }}

        $aboveCount = 0

        for ($i = 1; $i -le $samples; $i++) {
          $cpu = (Get-Counter '\Processor(_Total)\% Processor Time' -ErrorAction Stop |
                  Select-Object -ExpandProperty CounterSamples |
                  Select-Object -ExpandProperty CookedValue)

          if ($cpu -ge $threshold) {
              $aboveCount++
          }

          Start-Sleep -Seconds $interval
        }

        if ($aboveCount -gt 0) {
          Write-Output "HIGHCPU"
        } else {
          Write-Output "NORMALCPU"
        }
      register: cpu_check_result
      changed_when: false

    - name: Set CPU high fact
      set_fact:
        cpu_high_detected: "{{ (cpu_check_result.stdout | default('NORMALCPU')) is search('HIGHCPU') }}"

    - name: Debug CPU check result
      debug:
        msg: "CPU status over observation window: {{ 'HIGH' if cpu_high_detected else 'NORMAL' }}"

    - name: Restart IIS service if CPU high
      win_service:
        name: "{{ iis_service_name }}"
        state: restarted
      register: iis_restart_result
      when: cpu_high_detected
      failed_when: >
        cpu_high_detected and
        (iis_restart_result is failed or
         (iis_restart_result is defined and iis_restart_result.state is defined and
          iis_restart_result.state not in ['running', 'started']))
    
    - name: Set success status when IIS restarted
      set_fact:
        status_code: 1
        response_message: "IIS service '{{ iis_service_name }}' was restarted because CPU usage exceeded {{ cpu_threshold }}%."
      when: cpu_high_detected

    - name: Set success status when CPU normal
      set_fact:
        status_code: 1
        response_message: "CPU usage did not exceed {{ cpu_threshold }}%. IIS restart was not required."
      when: not cpu_high_detected

    - name: Handle unexpected failure
      block:
        - name: No-op block (used for structure)
          debug:
            msg: "Execution completed."
      rescue:
        - name: Set failure status on error
          set_fact:
            status_code: 2
            response_message: "Playbook execution failed: {{ ansible_failed_result.msg | default('Unknown error') }}"
      always:
        - name: Final status output
          debug:
            msg:
              status_code: "{{ status_code }}"
              response_message: "{{ response_message }}"