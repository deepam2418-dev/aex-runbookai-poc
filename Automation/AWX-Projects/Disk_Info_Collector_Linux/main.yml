---
- name: Get disk information from Linux host
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true

  vars:
    # You can pass this as an extra variable if you want specific mount points
    # Example: -e 'mount_points=/ /var'
    mount_points: []

  tasks:
    - name: Ensure Python is available (for module-based tasks if needed later)
      raw: test -x /usr/bin/python || test -x /usr/bin/python3
      register: python_check
      changed_when: false
      failed_when: false

    - name: Gather disk information using df -h
      shell: |
        if [ "{{ mount_points | length }}" -gt 0 ]; then
          df -h {{ mount_points | join(' ') }}
        else
          df -h
        fi
      register: disk_info
      changed_when: false
      failed_when: disk_info.rc != 0

    - name: Prepare success result
      set_fact:
        status_code: 1
        response_message: >-
          Disk information collected successfully.
          Command: df -h {{ mount_points | join(' ') if mount_points | length > 0 else '' }}
          Output stored in variable 'disk_info.stdout'.
      when: disk_info is succeeded

    - name: Prepare failure result
      set_fact:
        status_code: 2
        response_message: >-
          Failed to collect disk information.
          Return code: {{ disk_info.rc | default('N/A') }},
          Error: {{ disk_info.stderr | default('No error message') }}
      when: disk_info is failed

    - name: Show final result
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
          disk_info_stdout: "{{ disk_info.stdout | default('') }}"
          disk_info_stderr: "{{ disk_info.stderr | default('') }}"