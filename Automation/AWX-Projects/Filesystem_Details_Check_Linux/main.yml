---
- name: Filesystem_Details_Check_Linux
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    status_code: 0
    response_message: "Automation execution is in progress."

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution
      vars:
        status_code: "{{ status_code }}"
        response_message: "{{ response_message }}"

    - name: Main automation block
      block:

        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - (target_host | string | length) > 0
            fail_msg: "Required parameter target_host is missing or empty."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Set filesystem filter fact (optional)
          ansible.builtin.set_fact:
            filesystem_filter: "{{ filesystem_filter | default('') }}"

        - name: Collect filesystem details (df -h)
          ansible.builtin.command: >
            df -h {{ '-t ext4 -t xfs' if filesystem_filter == '' else '' }}
          register: df_output
          changed_when: false

        - name: Filter filesystem output (optional)
          ansible.builtin.set_fact:
            filtered_df_output: >-
              {{
                (df_output.stdout_lines
                 | select('search', filesystem_filter)
                 | list)
                if (filesystem_filter | length > 0)
                else df_output.stdout_lines
              }}

        - name: Display filesystem details in AWX output
          ansible.builtin.debug:
            msg: "{{ filtered_df_output }}"
          when: filtered_df_output is defined

        - name: Update job status - filesystem details collected
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Filesystem details collected successfully. Finalizing automation."

        - name: Set successful resolution status
          ansible.builtin.set_fact:
            status_code: 1
            response_message: "Automation completed successfully. Filesystem details have been collected and displayed."

        - name: Update job status - successfully resolved
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: >-
              Automation execution was not successful. The issue is being transferred for manual review.
              Error details: {{ df_output.stderr if (df_output is defined and df_output.stderr is defined) else 'Unknown error.' }}

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"