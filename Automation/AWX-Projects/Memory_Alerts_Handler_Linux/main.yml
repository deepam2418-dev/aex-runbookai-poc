# =========================================================
# PLAY - MEMORY MONITORING & AUTO REMEDIATION (LINUX)
# =========================================================
- name: Linux Memory Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  become: yes
  gather_facts: no

  vars:
    memory_threshold: "{{ threshold | default(80) }}"

    process_list:
      - testprocess

  tasks:

    # =====================================================
    # GET CURRENT MEMORY USAGE
    # =====================================================
    - name: Fetch current memory usage
      shell: |
        free | awk '/Mem:/ {printf("%.2f"), $3/$2 * 100}'
      register: memory_usage
      changed_when: false

    - name: Set memory value
      set_fact:
        memory_value: "{{ memory_usage.stdout | trim | float }}"

    - name: Display memory usage
      debug:
        msg: "Current Memory Usage: {{ memory_value }}%"

    # =====================================================
    # GET TOP MEMORY PROCESSES
    # =====================================================
    - name: Get top memory consuming processes
      shell: |
        ps -eo pid,comm,%mem --sort=-%mem | head -n 10
      register: top_memory_processes
      changed_when: false
      when: memory_value > memory_threshold

    # =====================================================
    # FILTER APPROVED PROCESSES
    # =====================================================
    - name: Filter approved processes
      set_fact:
        filtered_processes: >-
          {{
            top_memory_processes.stdout_lines[1:]
            | map('split')
            | selectattr('1', 'in', process_list)
            | list
          }}
      when: memory_value > memory_threshold

    # =====================================================
    # EXTRACT DETAILS
    # =====================================================
    - name: Extract process PIDs
      set_fact:
        filtered_pids: "{{ filtered_processes | map('first') | list }}"
      when: filtered_processes is defined

    - name: Extract process names
      set_fact:
        filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"
      when: filtered_processes is defined

    # =====================================================
    # KILL PROCESSES
    # =====================================================
    - name: Kill filtered high memory processes
      shell: "kill -9 {{ item }}"
      loop: "{{ filtered_pids }}"
      ignore_errors: yes
      when:
        - filtered_pids is defined
        - filtered_pids | length > 0
      register: kill_results

    - name: Set remediation status
      set_fact:
        process_killed: true
      when:
        - filtered_pids is defined
        - filtered_pids | length > 0

    - name: Set remediation skipped
      set_fact:
        process_killed: false
      when:
        - filtered_pids is not defined or filtered_pids | length == 0

    # =====================================================
    # WAIT
    # =====================================================
    - name: Wait for memory stabilization
      pause:
        seconds: 10
      when: process_killed

    # =====================================================
    # FINAL MEMORY CHECK
    # =====================================================
    - name: Fetch final memory usage
      shell: |
        free | awk '/Mem:/ {printf("%.2f"), $3/$2 * 100}'
      register: final_memory_usage
      changed_when: false

    - name: Set final memory value
      set_fact:
        final_memory_value: "{{ final_memory_usage.stdout | trim | float }}"

    # =====================================================
    # SET STATUS CODE
    # =====================================================
    - name: Set final status code
      set_fact:
        status_code: >-
          {{
            1 if final_memory_value < memory_threshold else 2
          }}

    # =====================================================
    # WORKNOTES (UPDATED ✅ WITH THRESHOLD)
    # =====================================================
    - name: Set worknotes
      set_fact:
        worknotes: >-
          {{

            (
              'Memory Status: Memory utilization is within acceptable threshold (' ~ memory_threshold|string ~ '%). No remediation required.\n'
              ~ '1. Memory Usage Before Remediation: ' ~ memory_value|string ~ '%\n'
              ~ '2. Configured Threshold: ' ~ memory_threshold|string ~ '%\n'
              ~ '3. Memory Usage After Remediation: NA\n'
              ~ '4. High Memory Processes: NA\n'
              ~ '5. Approved Processes: NA\n'
              ~ '6. Non-Approved Processes: NA\n'
              ~ '7. Process IDs (PIDs): NA\n'
              ~ '8. Action Taken: No action required'
            )

            if memory_value < memory_threshold

            else

            (

              (
                'Memory Status: Memory utilization exceeded threshold (' ~ memory_threshold|string ~ '%).\n'
                ~ '1. Memory Usage Before Remediation: ' ~ memory_value|string ~ '%\n'
                ~ '2. Memory Usage After Remediation: ' ~ final_memory_value|string ~ '%\n'
              )

              ~

              (
                '3. High Memory Processes: '
                ~ (filtered_names | join(', ') if filtered_names is defined and filtered_names|length>0 else 'NA') ~ '\n'
              )

              ~

              (
                '4. Approved Processes: '
                ~ (filtered_names | join(', ') if filtered_names is defined and filtered_names|length>0 else 'NA') ~ '\n'
              )

              ~

              (
                '5. Non-Approved Processes: '
                ~ ('Detected but not whitelisted' if (filtered_names|length == 0) else 'NA') ~ '\n'
              )

              ~

              (
                '6. Process IDs (PIDs): '
                ~ (filtered_pids | join(', ') if filtered_pids is defined and filtered_pids|length>0 else 'NA') ~ '\n'
              )

              ~

              (
                '7. Action Taken: '
                ~ (
                    'Processes terminated successfully'
                    if process_killed
                    else 'No approved process found - escalation required'
                  )
              )

            )
          }}

    # =====================================================
    # ESCALATION CONDITION
    # =====================================================
    - name: Set escalation flag
      set_fact:
        escalation_required: true
      when:
        - memory_value > memory_threshold
        - filtered_pids | default([]) | length == 0

    # =====================================================
    # RESPONSE MESSAGE
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {{
            (
              'Memory usage is within threshold (' ~ memory_threshold|string ~ '%). No remediation required.'
              if memory_value < memory_threshold
              else
              (
                'Memory exceeded threshold. '
                ~ (
                    'Issue escalated to Rhythm group due to unknown processes.'
                    if escalation_required | default(false)
                    else
                    'Remediation completed successfully.'
                  )
              )
            )
          }}

    # =====================================================
    # DISPLAY FINAL
    # =====================================================
    - name: Display final response
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
          worknotes: "{{ worknotes }}"

    # =====================================================
    # UPDATE IAUTOMATE
    # =====================================================
    - name: Update iautomate status
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        validate_certs: no
        user: "iautomate@syneoshealth.com"
        password: "Yy9%HyZW"
        method: PUT
        status_code: 200
        return_content: yes
        force_basic_auth: yes
        body_format: json
        body: "{{ lookup('template','status.json.j2') }}"
      delegate_to: localhost
      become: no
      register: status_update_iautomate
