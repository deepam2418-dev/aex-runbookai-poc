# =========================================================
# PLAY - MEMORY MONITORING & AUTO REMEDIATION (LINUX)
# =========================================================
- name: Linux Memory Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  become: yes
  gather_facts: no

  vars:
    memory_threshold: "{{ threshold | default(80) | float }}"

    process_list:
      - testprocess

  tasks:

    # =====================================================
    # GET CURRENT MEMORY USAGE
    # =====================================================
    - name: Fetch current memory usage
      shell: free | awk '/Mem:/ {printf("%.2f"), $3/$2 * 100}'
      register: memory_usage
      changed_when: false

    - name: Set memory value
      set_fact:
        memory_value: "{{ memory_usage.stdout | trim | float }}"

    # =====================================================
    # GET TOP MEMORY PROCESSES
    # =====================================================
    - name: Get top memory processes
      shell: ps -eo pid,comm,%mem --sort=-%mem | head -n 10
      register: top_memory_processes
      changed_when: false
      when: memory_value | float > memory_threshold | float

    # =====================================================
    # FILTER APPROVED PROCESSES
    # =====================================================
    - name: Filter approved processes
      set_fact:
        filtered_processes: >-
          {{
            top_memory_processes.stdout_lines[1:]
            | map('split')
            | selectattr('1', 'in', process_list)
            | list
          }}
      when: memory_value | float > memory_threshold | float

    # =====================================================
    # EXTRACT DETAILS
    # =====================================================
    - name: Extract PIDs
      set_fact:
        filtered_pids: "{{ filtered_processes | map('first') | list }}"
      when: filtered_processes is defined

    - name: Extract names
      set_fact:
        filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"
      when: filtered_processes is defined

    # =====================================================
    # KILL PROCESSES
    # =====================================================
    - name: Kill processes
      shell: kill -9 {{ item }}
      loop: "{{ filtered_pids }}"
      ignore_errors: yes
      when:
        - filtered_pids is defined
        - filtered_pids | length > 0

    - name: Set remediation status
      set_fact:
        process_killed: "{{ filtered_pids is defined and filtered_pids | length > 0 }}"

    # =====================================================
    # WAIT
    # =====================================================
    - name: Wait
      pause:
        seconds: 10
      when: process_killed

    # =====================================================
    # FINAL MEMORY CHECK
    # =====================================================
    - name: Fetch final memory usage
      shell: free | awk '/Mem:/ {printf("%.2f"), $3/$2 * 100}'
      register: final_memory_usage
      changed_when: false

    - name: Set final memory value
      set_fact:
        final_memory_value: "{{ final_memory_usage.stdout | trim | float }}"

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set status code
      set_fact:
        status_code: "{{ 1 if process_killed else 2 }}"

    # =====================================================
    # WORKNOTES ✅ FINAL LOGIC
    # =====================================================
    - name: Set worknotes
      set_fact:
        worknotes: >-
          {{
            (
              'Memory Status: Memory exceeded threshold (' ~ memory_threshold|string ~ '%)\n'
              ~ 'Host: ' ~ hostname ~ '\n'
              ~ 'Current Memory Utilization: ' ~ memory_value|string ~ '%\n\n'

              ~ '1. Memory Usage Before Remediation: ' ~ memory_value|string ~ '%\n'
              ~ '2. Memory Usage After Remediation: ' ~ final_memory_value|string ~ '%\n\n'

              ~ '3. High Memory Processes: ' ~ (filtered_names | join(', ')) ~ '\n'
              ~ '4. Process IDs: ' ~ (filtered_pids | join(', ')) ~ '\n\n'

              ~ '5. Action Taken: Processes terminated successfully'
            )

            if process_killed

            else

            (
              'Current memory utilization on (' ~ hostname ~ ') is (' ~ memory_value|string ~ '%).\n'
              ~ 'This is within the defined threshold of (' ~ memory_threshold|string ~ '%), so no action is required. Hence closing the ticket.'
            )
          }}

    # =====================================================
    # RESPONSE MESSAGE ✅ FINAL
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {{
            (
              'Memory issue detected and remediation completed successfully.'
              if process_killed
              else
              'Memory utilization is within threshold. No action required. Ticket will be closed.'
            )
          }}

    # =====================================================
    # FINAL OUTPUT
    # =====================================================
    - name: Display final response
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
          worknotes: "{{ worknotes }}"

    # =====================================================
    # UPDATE IAUTOMATE
    # =====================================================
    - name: Update iautomate status
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        validate_certs: no
        user: "iautomate@syneoshealth.com"
        password: "Yy9%HyZW"
        method: PUT
        status_code: 200
        return_content: yes
        force_basic_auth: yes
        body_format: json
        body: "{{ lookup('template','status.json.j2') }}"
      delegate_to: localhost
      become: no
      register: status_update_iautomate
