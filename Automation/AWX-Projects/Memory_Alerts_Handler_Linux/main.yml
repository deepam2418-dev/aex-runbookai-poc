--- 
# =========================================================
# MEMORY MONITORING & AUTO REMEDIATION
# =========================================================
- name: Memory Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no
  become: yes

  vars:
    memory_threshold: "{{ threshold | default(80) }}"

    process_list:
      - testprocess

  tasks:

    # =====================================================
    # CHECK CURRENT MEMORY USAGE
    # =====================================================
    - name: Get current Memory usage
      shell: "free | awk '/Mem:/ {printf(\"%.2f\", $3/$2 * 100)}'"
      register: current_memory
      changed_when: false

    - name: Set current Memory value
      set_fact:
        current_memory_value: "{{ current_memory.stdout | trim | float | round(2) }}"

    # =====================================================
    # INITIALIZE VARIABLES
    # =====================================================
    - name: Initialize variables
      set_fact:
        filtered_processes: []
        filtered_pids: []
        filtered_names: []
        process_killed: false
        final_memory_value: "{{ current_memory_value }}"
        high_memory_details: ""
        pid_details: ""
        action_details: ""
        approved_processes: ""
        non_approved_processes: ""

    # =====================================================
    # GET HIGH MEMORY PROCESSES
    # =====================================================
    - name: Get high memory processes
      shell: |
        ps -eo pid,comm,%mem --no-headers | awk '$3 > {{ memory_threshold }} {print $1, $2, $3}'
      register: high_memory
      changed_when: false
      when:
        - current_memory_value | float >= memory_threshold | float

    # =====================================================
    # STORE HIGH MEMORY DETAILS
    # =====================================================
    - name: Prepare high memory details
      set_fact:
        high_memory_details: "{{ high_memory.stdout_lines | join(' | ') if high_memory.stdout_lines is defined else 'None' }}"
      when:
        - current_memory_value | float >= memory_threshold | float

    # =====================================================
    # FILTER APPROVED PROCESSES
    # =====================================================
    - name: Filter only approved process names
      set_fact:
        filtered_processes: >-
          {{
            high_memory.stdout_lines
            | map('split')
            | selectattr('1', 'in', process_list)
            | list
          }}
      when:
        - current_memory_value | float >= memory_threshold | float

    # =====================================================
    # EXTRACT DETAILS
    # =====================================================
    - name: Extract process PIDs
      set_fact:
        filtered_pids: "{{ filtered_processes | map('first') | list }}"
      when:
        - current_memory_value | float >= memory_threshold | float

    - name: Extract process names
      set_fact:
        filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"
      when:
        - current_memory_value | float >= memory_threshold | float

    # =====================================================
    # PID DETAILS
    # =====================================================
    - name: Prepare PID details
      set_fact:
        pid_details: "{{ filtered_pids | join(', ') if filtered_pids | length > 0 else 'None' }}"
      when:
        - current_memory_value | float >= memory_threshold | float

    # =====================================================
    # CLASSIFY APPROVED / NON-APPROVED
    # =====================================================
    - name: Approved processes
      set_fact:
        approved_processes: "{{ filtered_names | unique | join(', ') if filtered_names | length > 0 else 'None' }}"
      when:
        - current_memory_value | float >= memory_threshold | float

    - name: Non-approved processes
      set_fact:
        non_approved_processes: >-
          {{
            high_memory.stdout_lines
            | map('split')
            | map(attribute=1)
            | difference(process_list)
            | unique
            | join(', ')
            if high_memory.stdout_lines is defined else 'None'
          }}
      when:
        - current_memory_value | float >= memory_threshold | float

    # =====================================================
    # KILL PROCESSES
    # =====================================================
    - name: Kill filtered high Memory processes
      shell: "kill -9 {{ item }}"
      loop: "{{ filtered_pids }}"
      register: kill_results
      ignore_errors: yes
      when:
        - current_memory_value | float >= memory_threshold | float
        - filtered_pids | length > 0

    # =====================================================
    # ACTION DETAILS
    # =====================================================
    - name: Prepare action details
      set_fact:
        action_details: >-
          {% if filtered_pids | length > 0 %}
          Killed processes: {{ filtered_pids | join(', ') }}
          {% else %}
          No approved processes found for termination
          {% endif %}

    - name: Set remediation status
      set_fact:
        process_killed: true
      when:
        - filtered_pids | length > 0

    # =====================================================
    # WAIT
    # =====================================================
    - name: Wait for stabilization
      pause:
        seconds: 10
      when:
        - process_killed | bool

    # =====================================================
    # RECHECK MEMORY
    # =====================================================
    - name: Get memory after remediation
      shell: "free | awk '/Mem:/ {printf(\"%.2f\", $3/$2 * 100)}'"
      register: memory_usage
      changed_when: false
      when:
        - process_killed | bool

    - name: Set final memory value
      set_fact:
        final_memory_value: "{{ memory_usage.stdout | trim | float | round(2) }}"
      when:
        - process_killed | bool

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set status
      set_fact:
        status_code: >-
          {{
            1 if (final_memory_value | float) < (memory_threshold | float)
            else 2
          }}

    # =====================================================
    # FINAL RESPONSE / WORKNOTES
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: |
          {% if current_memory_value | float < memory_threshold | float %}
          Current Memory utilization is {{ current_memory_value }}%. Which is within the defined threshold {{ memory_threshold }}%. No action required, Hence closing the ticket.
          {% else %}
          {% if final_memory_value | float < memory_threshold | float %}
          Memory Status: Issue Resolved After Remediation
          {% else %}
          Memory Status: Still High - Escalation Required
          {% endif %}

          Memory Utilization Before Remediation: {{ current_memory_value }}%

          Memory Utilization After Remediation: {{ final_memory_value }}%

          High Memory Processes: {{ high_memory_details }}

          Approved Processes: {{ approved_processes }}

          Non-Approved Processes: {{ non_approved_processes }}

          Process IDs (PIDs): {{ pid_details }}

          Action Taken: {{ action_details }}
          {% endif %}

    # =====================================================
    # DISPLAY
    # =====================================================
    - name: Output
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"

    # =====================================================
    # IAUTOMATE UPDATE
    # =====================================================
    - name: Update iautomate status
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        validate_certs: no
        user: "{{ iautomate_user }}"
        password: "{{ iautomate_pass }}"
        method: PUT
        status_code: 200
        return_content: yes
        force_basic_auth: yes
        body_format: json
        body: "{{ lookup('template','status.json.j2') }}"
      delegate_to: localhost
      become: no