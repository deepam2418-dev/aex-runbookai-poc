---
- name: Linux_User_Creation_Handler_Linux
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    # Mandatory status tracking
    status_code: 0
    response_message: "Automation execution is in progress."

    # Functional parameters (to be provided at runtime)
    linux_username: "{{ linux_username | default('testuser01') }}"

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution
      vars:
        status_code: "{{ status_code }}"
        response_message: "{{ response_message }}"

    - name: Main automation block
      block:

        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - (target_host | string | length) > 0
              - linux_username is defined
              - (linux_username | string | length) > 0
            fail_msg: "Required parameter(s) missing: target_host and/or linux_username."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Ensure Linux user exists
          ansible.builtin.user:
            name: "{{ linux_username }}"
            state: present
            create_home: true
          register: user_result

        - name: Update job status - user creation step completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: >-
              Linux user '{{ linux_username }}' has been ensured present on the target host.
              Automation is still in progress.

        - name: Set successful resolution status
          ansible.builtin.set_fact:
            status_code: 1
            response_message: >-
              Automation completed successfully. Linux user '{{ linux_username }}'
              exists on the target host and the issue has been resolved.

        - name: Update job status - successfully resolved
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: >-
              Automation execution was not successful. The issue is being transferred
              for manual review. Please verify connectivity, permissions, or
              parameter values for creating user '{{ linux_username }}'.

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"