# =========================================================
# PLAY 1 - FILESYSTEM MONITORING & AUTO REMEDIATION
# =========================================================
- name: Filesystem Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  become: yes
  gather_facts: no

  vars:
    filesystem_threshold: "{{ threshold | default(80) }}"

    allowed_cleanup_dirs:
      - /var/log
      - /tmp

    cleanup_pattern:
      - "*.md"

  tasks:

    # =====================================================
    # FETCH CURRENT FILESYSTEM USAGE
    # =====================================================
    - name: Fetch highest filesystem usage
      shell: |
        df -hP | awk 'NR>1 {
          usage=$5
          gsub("%","",usage)
          print usage
        }' | sort -nr | head -1
      register: fs_output
      changed_when: false

    - name: Set filesystem fact
      set_fact:
        filesystem_usage: "{{ fs_output.stdout | trim | float | round(2) }}"

    # =====================================================
    # INITIALIZE VARIABLES
    # =====================================================
    - name: Initialize variables
      set_fact:
        final_filesystem_usage: "{{ filesystem_usage }}"
        exceeded_details: ""
        files_deleted: ""
        action_details: ""
        cleanup_performed: false

    # =====================================================
    # GET FILESYSTEMS EXCEEDING THRESHOLD
    # =====================================================
    - name: Get filesystems exceeding threshold
      shell: |
        df -hP | awk -v threshold="{{ filesystem_threshold }}" '
        NR>1 {
          usage=$5
          gsub("%","",usage)
          if (usage+0 > threshold+0)
            print $1, $5, $6
        }'
      register: exceeded_fs
      when:
        - filesystem_usage > filesystem_threshold

    - name: Prepare exceeded filesystem details
      set_fact:
        exceeded_details: "{{ exceeded_fs.stdout_lines | join(' | ') if exceeded_fs.stdout_lines is defined else 'None' }}"
      when:
        - filesystem_usage > filesystem_threshold

    # =====================================================
    # FIND FILES FOR CLEANUP
    # =====================================================
    - name: Find files eligible for cleanup
      find:
        paths: "{{ allowed_cleanup_dirs }}"
        patterns: "{{ cleanup_pattern }}"
        file_type: file
        recurse: yes
      register: files_to_delete
      when:
        - filesystem_usage > filesystem_threshold

    - name: Prepare files list
      set_fact:
        files_deleted: "{{ files_to_delete.files | map(attribute='path') | join(', ') if files_to_delete.files | length > 0 else 'No files found for cleanup' }}"
      when:
        - files_to_delete.files is defined

    # =====================================================
    # DELETE FILES
    # =====================================================
    - name: Delete eligible files
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ files_to_delete.files }}"
      register: delete_output
      when:
        - filesystem_usage > filesystem_threshold
        - files_to_delete.files | length > 0

    - name: Set cleanup status
      set_fact:
        cleanup_performed: "{{ delete_output.changed | default(false) }}"

    # =====================================================
    # ACTION DETAILS
    # =====================================================
    - name: Prepare action details
      set_fact:
        action_details: >-
          {% if files_to_delete.files | length > 0 %}
          Cleaned up files from directories: {{ allowed_cleanup_dirs | join(', ') }}
          {% else %}
          No files matched cleanup criteria
          {% endif %}

    # =====================================================
    # WAIT AFTER CLEANUP
    # =====================================================
    - name: Wait after cleanup
      pause:
        seconds: 10
      when:
        - cleanup_performed | bool

    # =====================================================
    # RECHECK FILESYSTEM USAGE
    # =====================================================
    - name: Recheck filesystem usage
      shell: |
        df -hP | awk 'NR>1 {
          usage=$5
          gsub("%","",usage)
          print usage
        }' | sort -nr | head -1
      register: fs_after
      changed_when: false
      when:
        - cleanup_performed | bool

    - name: Set final filesystem usage
      set_fact:
        final_filesystem_usage: "{{ fs_after.stdout | trim | float | round(2) }}"
      when:
        - cleanup_performed | bool

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set final status
      set_fact:
        status_code: >-
          {{
            1 if (final_filesystem_usage | float) < (filesystem_threshold | float)
            else 2
          }}

    # =====================================================
    # FINAL RESPONSE (POINT-WISE + 
)
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {% if filesystem_usage | float < filesystem_threshold | float %}
          1. Filesystem utilization is within the configured threshold.

          {% elif final_filesystem_usage | float < filesystem_threshold | float %}
          1. Filesystem usage exceeded threshold and was successfully reduced after cleanup.

          {% else %}
          1. Filesystem usage remains high even after cleanup. Escalation required.

          {% endif %}
          2. Filesystem Usage Before Remediation: {{ filesystem_usage }}%

          3. Filesystem Usage After Remediation: {{ final_filesystem_usage }}%

          4. Affected Filesystems: {{ exceeded_details }}

          5. Cleanup Directories: {{ allowed_cleanup_dirs | join(', ') }}

          6. Files Identified for Cleanup: {{ files_deleted }}

          7. Action Taken: {{ action_details }}

    # =====================================================
    # DISPLAY FINAL RESULT
    # =====================================================
    - name: Display final response
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"

    # =====================================================
    # UPDATE IAUTOMATE STATUS
    # =====================================================
    - name: Update iautomate url about status
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        validate_certs: no
        user: "iautomate@syneoshealth.com"
        password: "Yy9%HyZW"
        method: PUT
        status_code: 200
        return_content: yes
        force_basic_auth: yes
        body_format: json
        body: "{{lookup('template','status.json.j2')}}"
      delegate_to: localhost
      become: no
