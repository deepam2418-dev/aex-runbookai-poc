# =========================================================
# PLAY 1 - FILESYSTEM MONITORING & AUTO REMEDIATION
# =========================================================
- name: Filesystem Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  become: yes
  gather_facts: no

  vars:
    filesystem_threshold: "{{ threshold | default(80) }}"

    allowed_cleanup_dirs:
      - /var/log
      - /tmp
    

    cleanup_pattern:
      - "*.md"

  tasks:

    # =====================================================
    # FETCH CURRENT FILESYSTEM USAGE
    # =====================================================
    - name: Fetch highest filesystem usage
      shell: |
        df -hP | awk 'NR>1 {
          usage=$5
          gsub("%","",usage)
          print usage
        }' | sort -nr | head -1
      register: fs_output
      changed_when: false

    - name: Set filesystem fact
      set_fact:
        filesystem_usage: "{{ fs_output.stdout | trim | float | round(2) }}"

    - name: Display filesystem usage
      debug:
        msg: "Current Filesystem Usage: {{ filesystem_usage }}%"

    # =====================================================
    # CHECK IF THRESHOLD EXCEEDED
    # =====================================================
    - name: Get filesystems exceeding threshold
      shell: |
        df -hP | awk -v threshold="{{ filesystem_threshold }}" '
        NR>1 {
          usage=$5
          gsub("%","",usage)
          if (usage+0 > threshold+0)
            print $1, $5, $6
        }'
      register: exceeded_fs
      when:
        - filesystem_usage > filesystem_threshold

    - name: Display exceeded filesystems
      debug:
        var: exceeded_fs.stdout_lines
      when:
        - filesystem_usage > filesystem_threshold

    # =====================================================
    # FIND FILES FOR CLEANUP
    # =====================================================
    - name: Find files eligible for cleanup
      find:
        paths: "{{ allowed_cleanup_dirs }}"
        patterns: "{{ cleanup_pattern }}"
        file_type: file
        recurse: yes
      register: files_to_delete
      when:
        - filesystem_usage > filesystem_threshold

    - name: Display files for cleanup
      debug:
        msg: "{{ item.path }}"
      loop: "{{ files_to_delete.files }}"
      when:
        - files_to_delete.files is defined
        - files_to_delete.files | length > 0

    # =====================================================
    # DELETE FILES
    # =====================================================
    - name: Delete eligible files
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ files_to_delete.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: delete_output
      when:
        - filesystem_usage > filesystem_threshold
        - files_to_delete.files | length > 0

    - name: Set cleanup status
      set_fact:
        cleanup_performed: true
      when:
        - delete_output is defined

    - name: Set cleanup skipped
      set_fact:
        cleanup_performed: false
      when:
        - cleanup_performed is not defined

    # =====================================================
    # WAIT AFTER CLEANUP
    # =====================================================
    - name: Wait after cleanup
      pause:
        seconds: 10
      when:
        - cleanup_performed | bool

    # =====================================================
    # RECHECK FILESYSTEM USAGE
    # =====================================================
    - name: Recheck filesystem usage
      shell: |
        df -hP | awk 'NR>1 {
          usage=$5
          gsub("%","",usage)
          print usage
        }' | sort -nr | head -1
      register: fs_after
      changed_when: false
      when:
        - cleanup_performed | bool

    - name: Set final filesystem usage
      set_fact:
        final_filesystem_usage: "{{ fs_after.stdout | trim | float | round(2) }}"
      when:
        - cleanup_performed | bool

    # =====================================================
    # FALLBACK (NO REMEDIATION)
    # =====================================================
    - name: Set fallback filesystem usage
      set_fact:
        final_filesystem_usage: "{{ filesystem_usage }}"
      when:
        - final_filesystem_usage is not defined

    # =====================================================
    # FINAL STATUS & RESPONSE (ALIGNED TO CPU)
    # =====================================================
    - name: Set final response
      set_fact:
        status_code: >-
          {{
            1 if (final_filesystem_usage | float) < (filesystem_threshold | float)
            else 2
          }}

        response_message: >-
          {{
            'Filesystem usage on host ' ~ hostname ~
            ' was initially detected at ' ~ (filesystem_usage | string) ~
            '%, exceeding the configured threshold of ' ~
            (filesystem_threshold | string) ~ '%. ' ~

            (
              'Cleanup was performed in allowed directories (' ~
              allowed_cleanup_dirs | join(', ') ~ '). '
              if cleanup_performed | bool
              else
              'No eligible files were found for cleanup. '
            ) ~

            'Post-remediation filesystem utilization is ' ~
            (final_filesystem_usage | string) ~ '%. ' ~

            (
              'Filesystem usage is now within acceptable limits. Marking the ticket as resolved.'
              if (final_filesystem_usage | float) < (filesystem_threshold | float)
              else
              'Filesystem usage remains high after remediation. Escalating the ticket.'
            )
          }}

    # =====================================================
    # DISPLAY FINAL RESULT
    # =====================================================
    - name: Display final response
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"


    # =====================================================
    # UPDATE IAUTOMATE STATUS
    # =====================================================
    - name: Update iautomate url about status
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        validate_certs: no
        user: "iautomate@syneoshealth.com"
        password: "Yy9%HyZW"
        method: PUT
        status_code: 200
        return_content: yes
        force_basic_auth: yes
        body_format: json
        body: "{{lookup('template','status.json.j2')}}"
      delegate_to: localhost
      become: no
      register: status_update_iautomate          