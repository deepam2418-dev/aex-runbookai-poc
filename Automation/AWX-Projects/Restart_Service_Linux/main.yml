---
- name: Restart_Service_Linux
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    status_code: 0
    response_message: "Automation execution is in progress."

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution

    - name: Main automation block
      block:
        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - target_host | string | length > 0
              - service_name is defined
              - service_name | string | length > 0
            fail_msg: "Required parameter target_host or service_name is missing."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Ensure the service exists on the target host
          ansible.builtin.shell: |
            systemctl status {{ service_name }}
          register: service_status_check
          ignore_errors: true

        - name: Update job status - service existence check completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: >
              {% if service_status_check.rc == 0 %}
                Service {{ service_name }} exists. Proceeding to restart.
              {% else %}
                Service {{ service_name }} does not exist. Will fail gracefully.
              {% endif %}

        - name: Fail if service does not exist
          ansible.builtin.fail:
            msg: "Service {{ service_name }} does not exist on the target host."
          when: service_status_check.rc != 0

        - name: Restart the specified service
          ansible.builtin.service:
            name: "{{ service_name }}"
            state: restarted

        - name: Update job status - service restart completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Service {{ service_name }} restarted successfully. Automation is still in progress."

        - name: Set successful resolution status
          ansible.builtin.set_fact:
            status_code: 1
            response_message: "Automation completed successfully. The service {{ service_name }} was restarted on {{ target_host }}."

        - name: Update job status - successfully resolved
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: "Automation execution was not successful. The issue is being transferred for manual review."

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution