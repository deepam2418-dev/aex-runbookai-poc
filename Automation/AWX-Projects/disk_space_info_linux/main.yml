---
- name: Collect disk space information from Linux host
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true

  vars:
    # 'all' or comma-separated list of mount points (e.g. "/,/var,/opt")
    filesystem_filter: "all"
    command_timeout: 60

  pre_tasks:
    - name: Validate required variable - target_host
      assert:
        that:
          - target_host is defined
          - target_host | string | length > 0
        fail_msg: "The variable 'target_host' is required and must be a non-empty string."
        success_msg: "Variable 'target_host' is defined and valid."

    - name: Validate filesystem_filter variable
      assert:
        that:
          - filesystem_filter is defined
          - filesystem_filter is string
        fail_msg: "The variable 'filesystem_filter' must be defined and a string."
        success_msg: "Variable 'filesystem_filter' is defined and valid."

  tasks:
    - block:
        - name: Collect df output in POSIX portable format (KB)
          ansible.builtin.command: "df -P -k"
          register: df_output
          changed_when: false
          failed_when: df_output.rc != 0

        - name: Initialize disk_usage list
          set_fact:
            disk_usage_list: []

        - name: Build structured disk usage list from df output
          set_fact:
            disk_usage_list: "{{ disk_usage_list + [item_structured] }}"
          loop: "{{ df_output.stdout_lines[1:] | default([]) }}"
          vars:
            # Normalize whitespace, split into fields
            fields: "{{ (item | regex_replace('\\s+', ' ') | trim).split(' ') }}"
            fields_len: "{{ fields | length }}"

            item_structured: >-
              {{
                {
                  "filesystem": fields[0],
                  "blocks_kb": (
                    (fields[1] is match('^[0-9]+$'))
                    | ternary(fields[1] | int, fields[1])
                  ),
                  "used_kb": (
                    (fields[2] is match('^[0-9]+$'))
                    | ternary(fields[2] | int, fields[2])
                  ),
                  "available_kb": (
                    (fields[3] is match('^[0-9]+$'))
                    | ternary(fields[3] | int, fields[3])
                  ),
                  "use_percent": fields[4],
                  "mount_point": (fields[5:] | join(' '))
                }
                if fields_len | int >= 6
                else omit
              }}

        - name: Apply filesystem filter if not 'all'
          set_fact:
            disk_usage_structured: >-
              {{
                disk_usage_list
                if filesystem_filter == 'all'
                else disk_usage_list
                     | selectattr('mount_point', 'in',
                         filesystem_filter.split(',') | map('trim') | list)
                     | list
              }}

        - name: Prepare success result structure
          set_fact:
            disk_space_result:
              status_code: 1
              response_message: "Disk space information collected successfully."
              execution_details:
                target_host: "{{ target_host }}"
                filesystem_filter: "{{ filesystem_filter }}"
                raw_command: "df -P -k"
                disk_usage: "{{ disk_usage_structured | default([]) }}"

      rescue:
        - name: Prepare failure result structure
          set_fact:
            disk_space_result:
              status_code: 2
              response_message: >-
                Failed to collect disk space information.
                Error: {{ df_output.stderr | default('Unknown error') }}
              execution_details:
                target_host: "{{ target_host | default('unknown') }}"
                filesystem_filter: "{{ filesystem_filter | default('unknown') }}"
                raw_command: "df -P -k"
                error_rc: "{{ df_output.rc | default(0) }}"
                stderr: "{{ df_output.stderr | default('') }}"

  post_tasks:
    - name: Display disk space result
      debug:
        var: disk_space_result
