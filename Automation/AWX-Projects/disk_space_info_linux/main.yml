---
- name: Collect disk space information from Linux host
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true
  vars:
    filesystem_filter: "all"   # 'all' or comma-separated list of mount points
    command_timeout: 60

  pre_tasks:
    - name: Validate required variable - target_host
      assert:
        that:
          - target_host is defined
          - target_host | string | length > 0
        fail_msg: "The variable 'target_host' is required and must be a non-empty string."
        success_msg: "Variable 'target_host' is defined and valid."

    - name: Validate filesystem_filter variable
      assert:
        that:
          - filesystem_filter is defined
          - filesystem_filter is string
        fail_msg: "The variable 'filesystem_filter' must be defined and a string."
        success_msg: "Variable 'filesystem_filter' is defined and valid."

  tasks:
    - block:
        - name: Collect raw df output
          ansible.builtin.command: "df -P -k"
          register: df_output
          changed_when: false
          failed_when: df_output.rc != 0

        - name: Parse df output to JSON via Python helper
          ansible.builtin.command: >-
            python3 - << 'EOF'
            import json
            import sys

            raw = '''{{ df_output.stdout | replace("'", "'\''") }}'''.splitlines()
            # Skip header
            lines = raw[1:]
            results = []
            for line in lines:
                line = line.strip()
                if not line:
                    continue
                parts = line.split()
                # Expect at least 6 fields: filesystem, blocks, used, available, use%, mount
                if len(parts) < 6:
                    # Skip malformed lines
                    continue
                filesystem = parts[0]
                blocks_kb = parts[1]
                used_kb = parts[2]
                available_kb = parts[3]
                use_percent = parts[4]
                mount_point = " ".join(parts[5:])
                results.append({
                    "filesystem": filesystem,
                    "blocks_kb": int(blocks_kb) if blocks_kb.isdigit() else blocks_kb,
                    "used_kb": int(used_kb) if used_kb.isdigit() else used_kb,
                    "available_kb": int(available_kb) if available_kb.isdigit() else available_kb,
                    "use_percent": use_percent,
                    "mount_point": mount_point,
                })

            print(json.dumps(results))
            EOF
          register: df_parsed
          changed_when: false

        - name: Load parsed JSON into Ansible fact
          set_fact:
            disk_usage_all: "{{ df_parsed.stdout | from_json }}"

        - name: Apply filesystem filter if not 'all'
          set_fact:
            disk_usage_structured: >-
              {{
                disk_usage_all
                if filesystem_filter == 'all'
                else disk_usage_all | selectattr('mount_point', 'in',
                     filesystem_filter.split(',') | map('trim') | list) | list
              }}

        - name: Prepare success result structure
          set_fact:
            disk_space_result:
              status_code: 1
              response_message: "Disk space information collected successfully."
              execution_details:
                target_host: "{{ target_host }}"
                filesystem_filter: "{{ filesystem_filter }}"
                raw_command: "df -P -k"
                disk_usage: "{{ disk_usage_structured | default([]) }}"
      rescue:
        - name: Prepare failure result structure
          set_fact:
            disk_space_result:
              status_code: 2
              response_message: >-
                Failed to collect disk space information.
                Error: {{ df_output.stderr | default('Unknown error') }}
              execution_details:
                target_host: "{{ target_host }}"
                filesystem_filter: "{{ filesystem_filter }}"
                raw_command: "df -P -k"
                error_rc: "{{ df_output.rc | default(0) }}"
                stderr: "{{ df_output.stderr | default('') }}"

  post_tasks:
    - name: Display disk space result
      debug:
        var: disk_space_result
