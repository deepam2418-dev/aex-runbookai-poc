---
- name: Restart Apache service on a given Linux host
  hosts: "{{ target_host }}"
  gather_facts: yes
  vars:
    apache_service_name: "{{ apache_service_name_var | default('') }}"
    status_code: 0
    response_message: ""

  tasks:
    - name: Validate target_host is provided
      assert:
        that:
          - target_host is defined
          - target_host | string | length > 0
        fail_msg: "target_host is required and cannot be empty."
        success_msg: "target_host parameter is valid."

    - name: Detect default Apache service name based on OS if not provided
      set_fact:
        apache_service_name: >-
          {% if apache_service_name_var is defined and apache_service_name_var | string | length > 0 %}
            {{ apache_service_name_var }}
          {% else %}
            {% if ansible_facts['os_family'] == 'RedHat' %}
              httpd
            {% elif ansible_facts['os_family'] == 'Debian' %}
              apache2
            {% else %}
              httpd
            {% endif %}
          {% endif %}

    - name: Restart Apache service
      block:
        - name: Restart Apache using service module
          ansible.builtin.service:
            name: "{{ apache_service_name }}"
            state: restarted
          register: apache_restart_result

        - name: Set success status code and message
          set_fact:
            status_code: 1
            response_message: >-
              Apache service '{{ apache_service_name }}' restarted successfully
              on host '{{ inventory_hostname }}'. Result: {{ apache_restart_result | to_nice_json }}

      rescue:
        - name: Set failure status code and message
          set_fact:
            status_code: 2
            response_message: >-
              Failed to restart Apache service '{{ apache_service_name }}'
              on host '{{ inventory_hostname }}'. Error: {{ ansible_failed_result | default({}) | to_nice_json }}

    - name: Display execution result
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"