---
# =========================================================
# PLAY 1 - WINDOWS CPU MONITORING & AUTO REMEDIATION
# =========================================================
- name: Windows CPU Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no

  vars:
    cpu_threshold: "{{ threshold | default(80) }}"

    # Approved processes for remediation
    process_list:
      - powershell
      # - chrome
      # - java

  tasks:

    # =====================================================
    # GET CURRENT CPU USAGE
    # =====================================================
    - name: Fetch Windows CPU usage
      raw: powershell "(Get-Counter '\Processor(_Total)\% Processor Time').CounterSamples.CookedValue"
      register: windows_cpu_output

    - name: Set CPU value
      set_fact:
        cpu_value: "{{ windows_cpu_output.stdout | default('0') | trim | float | round(2) }}"

    - name: Display Windows CPU usage
      debug:
        msg: "Current CPU Usage: {{ cpu_value }}%"

    # =====================================================
    # DEFAULT VARIABLES
    # =====================================================
    - name: Initialize default variables
      set_fact:
        filtered_processes: []
        filtered_pids: []
        process_killed: false
        final_cpu_value: "{{ cpu_value }}"
        status_code: 1

    # =====================================================
    # GET HIGH CPU PROCESSES
    # =====================================================
    - name: Get top Windows CPU processes
      raw: |
        powershell -Command "Get-Counter '\Process(*)\% Processor Time' | Select-Object -ExpandProperty CounterSamples | Sort-Object CookedValue -Descending | Select-Object -First 20 InstanceName,CookedValue"
      register: windows_process_output
      when:
        - cpu_value | float > cpu_threshold | float

    - name: Display top CPU processes
      debug:
        var: windows_process_output.stdout_lines
      when:
        - windows_process_output is defined
        - windows_process_output.stdout_lines is defined

    # =====================================================
    # FILTER APPROVED PROCESSES
    # =====================================================
    - name: Filter approved processes
      set_fact:
        filtered_processes: >-
          {{
            windows_process_output.stdout_lines
            | default([])
            | select('search', '(' ~ (process_list | join('|')) ~ ')')
            | list
          }}
      when:
        - windows_process_output is defined
        - windows_process_output.stdout_lines is defined

    - name: Display filtered processes
      debug:
        msg: "{{ filtered_processes }}"
      when:
        - filtered_processes | length > 0

    # =====================================================
    # GET PROCESS IDS
    # =====================================================
    - name: Get process IDs
      raw: >
        powershell "
        Get-Process |
        Where-Object { $_.ProcessName -match '{{ process_list | join("|") }}' } |
        Select-Object -ExpandProperty Id
        "
      register: pid_output
      when:
        - filtered_processes | length > 0

    - name: Set filtered PIDs
      set_fact:
        filtered_pids: >-
          {{
            pid_output.stdout_lines
            | default([])
            | map('trim')
            | reject('equalto', '')
            | list
          }}
      when:
        - pid_output is defined

    - name: Display filtered PIDs
      debug:
        msg: "{{ filtered_pids }}"
      when:
        - filtered_pids | length > 0

    # =====================================================
    # KILL APPROVED HIGH CPU PROCESSES
    # =====================================================
    - name: Kill approved high CPU processes
      raw: powershell "Stop-Process -Id {{ item }} -Force"
      loop: "{{ filtered_pids }}"
      ignore_errors: yes
      register: kill_results
      when:
        - filtered_pids | length > 0

    - name: Set remediation status
      set_fact:
        process_killed: true
      when:
        - filtered_pids | length > 0

    # =====================================================
    # WAIT FOR CPU STABILIZATION
    # =====================================================
    - name: Wait for CPU stabilization
      pause:
        seconds: 10
      when:
        - process_killed | bool

    # =====================================================
    # RECHECK CPU USAGE
    # =====================================================
    - name: Recheck Windows CPU usage
      raw: powershell "(Get-Counter '\Processor(_Total)\% Processor Time').CounterSamples.CookedValue"
      register: final_cpu_output
      when:
        - cpu_value | float > cpu_threshold | float

    - name: Set final CPU value
      set_fact:
        final_cpu_value: "{{ final_cpu_output.stdout | default('0') | trim | float | round(2) }}"
      when:
        - final_cpu_output is defined

    - name: Display final CPU usage
      debug:
        msg: "Final CPU Usage: {{ final_cpu_value }}%"

    # =====================================================
    # SET FINAL STATUS CODE
    # =====================================================
    - name: Set final status code
      set_fact:
        status_code: >-
          {{
            1 if (final_cpu_value | float) < (cpu_threshold | float)
            else 2
          }}

    # =====================================================
    # SET RESPONSE MESSAGE
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {{

            (
              'CPU usage on host ' ~ hostname ~
              ' is currently at ' ~
              (cpu_value | string) ~
              '%, which is within the configured threshold of ' ~
              (cpu_threshold | string) ~
              '%. No remediation was required. Marking the ticket as resolved.'
            )

            if (cpu_value | float) < (cpu_threshold | float)

            else

            (

              (
                'CPU usage on host ' ~ hostname ~
                ' was initially detected at ' ~
                (cpu_value | string) ~
                '%, exceeding the configured threshold of ' ~
                (cpu_threshold | string) ~ '%. '
              )

              ~

              (
                'Approved high CPU processes identified: ' ~
                (process_list | join(', ')) ~ '. '
                if filtered_pids | length > 0
                else
                'No approved high CPU processes were identified for remediation. '
              )

              ~

              (
                'Automation terminated the matching processes with PIDs: ' ~
                (filtered_pids | join(', ')) ~ '. '
                if filtered_pids | length > 0
                else
                ''
              )

              ~

              (
                'Post-remediation CPU utilization is ' ~
                (final_cpu_value | string) ~
                '%. CPU utilization returned to normal levels. Marking the ticket as resolved.'
                if (final_cpu_value | float) < (cpu_threshold | float)
                else
                'Post-remediation CPU utilization remains at ' ~
                (final_cpu_value | string) ~
                '%, which is still above the configured threshold. Escalating the ticket for further investigation.'
              )

            )
          }}

    # =====================================================
    # DISPLAY FINAL RESPONSE
    # =====================================================
    - name: Display final response
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"

    # =====================================================
    # UPDATE IAUTOMATE
    # =====================================================
    - name: Update iautomate url about status
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        validate_certs: no
        user: "{{ iautomate_user }}"
        password: "{{ iautomate_pass }}"
        method: PUT
        status_code: 200
        return_content: yes
        force_basic_auth: yes
        body_format: json
        body: "{{ lookup('template','status.json.j2') }}"
      delegate_to: localhost
      register: status_update_iautomate
