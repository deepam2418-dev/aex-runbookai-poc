---
- name: Service_Restart_Linux
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    status_code: 0
    response_message: "Automation execution is in progress."

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution

    - name: Main automation block
      block:
        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - target_host | string | length > 0
              - service_name is defined
              - service_name | string | length > 0
            fail_msg: "Required parameter(s) missing. 'target_host' and 'service_name' are mandatory."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Restart the specified service
          ansible.builtin.service:
            name: "{{ service_name }}"
            state: restarted

        - name: Update job status - service restart issued
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Service '{{ service_name }}' restart command issued. Verifying status..."

        - name: Ensure the service is running after restart
          ansible.builtin.service_facts:

        - name: Check if the service is running after restart
          ansible.builtin.assert:
            that:
              - (ansible_facts.services[service_name].state == "running")
            fail_msg: "Service '{{ service_name }}' is not running after restart."
            success_msg: "Service '{{ service_name }}' is running after restart."

        - name: Update job status - successfully resolved
          ansible.builtin.set_fact:
            status_code: 1
            response_message: "Automation completed successfully. Service '{{ service_name }}' was restarted and is running."

        - name: Update job status - successfully resolved
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: "Automation execution was not successful. The issue is being transferred for manual review."

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution