---
- name: Service_Restart_If_Not_Running_Linux
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    status_code: 0
    response_message: "Automation execution is in progress."

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution

    - name: Main automation block
      block:
        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - target_host | string | length > 0
              - service_name is defined
              - service_name | string | length > 0
            fail_msg: "Required parameter(s) missing."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Check if service is running
          ansible.builtin.service_facts:

        - name: Set fact for service running state
          ansible.builtin.set_fact:
            service_running: "{{ (ansible_facts.services[service_name].state == 'running') if (service_name in ansible_facts.services) else false }}"

        - name: Restart service if not running
          when: not service_running
          block:
            - name: Restart the specified service
              ansible.builtin.service:
                name: "{{ service_name }}"
                state: restarted

            - name: Update job status - service restarted successfully
              ansible.builtin.include_role:
                name: Job_Updates
              vars:
                status_code: 1
                response_message: "Service '{{ service_name }}' was not running and has been restarted successfully."

            - name: Set successful resolution status after restart
              ansible.builtin.set_fact:
                status_code: 1
                response_message: "Automation completed successfully. The issue has been resolved."

          rescue:
            - name: Set failed and transferred status after restart failure
              ansible.builtin.set_fact:
                status_code: -1
                response_message: "Failed to restart '{{ service_name }}'. The issue is being transferred for manual review."

            - name: Update job status - execution not successful and transferred after restart failure
              ansible.builtin.include_role:
                name: Job_Updates
              vars:
                status_code: "{{ status_code }}"
                response_message: "{{ response_message }}"

        - name: Update job status - no action needed, service already running
          when: service_running
          block:
            - name: Set successful resolution status, no restart needed
              ansible.builtin.set_fact:
                status_code: 1
                response_message: "Service '{{ service_name }}' is already running. No restart was needed."

            - name: Update job status - successfully resolved, no action taken
              ansible.builtin.include_role:
                name: Job_Updates
              vars:
                status_code: "{{ status_code }}"
                response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status for main logic failure
          ansible.builtin.set_fact:
            status_code: -1
            response_message: "Automation execution was not successful. The issue is being transferred for manual review."

        - name: Update job status - execution not successful and transferred for main logic failure
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution