---
- name: Process_Status_Check_Windows
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    status_code: 0
    response_message: "Automation execution is in progress."

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution

    - name: Main automation block
      block:

        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - target_host | string | length > 0
              - process_name is defined
              - process_name | string | length > 0
            fail_msg: "Required parameters target_host or process_name are missing."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Check if process is running on Windows server
          ansible.windows.win_shell: |
            $process = Get-Process -Name "{{ process_name }}" -ErrorAction SilentlyContinue | Select-Object -First 1

            if ($process) {
                Write-Output "RUNNING|$($process.Id)"
                exit 0
            }
            else {
                Write-Output "NOT_RUNNING"
                exit 1
            }
          register: process_status
          failed_when: false

        - name: Update job status - process check completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Process check completed. Evaluating result..."

        - name: Set successful resolution status if process is running
          ansible.builtin.set_fact:
            status_code: 1
            response_message: >-
              Process '{{ process_name }}' is running on the server.
              Process details: {{ process_status.stdout | trim }}
          when:
            - process_status.rc == 0
            - "'RUNNING' in process_status.stdout"

        - name: Set not found status if process is not running
          ansible.builtin.set_fact:
            status_code: -1
            response_message: >-
              Process '{{ process_name }}' is not running on the server.
              The issue is being transferred for manual review.
          when:
            - process_status.rc != 0
              or 'NOT_RUNNING' in process_status.stdout

        - name: Update job status after final evaluation
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status due to error
          ansible.builtin.set_fact:
            status_code: -1
            response_message: "Automation execution was not successful due to an error. The issue is being transferred for manual review."

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution