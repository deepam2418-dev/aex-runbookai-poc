# =========================================================
# PLAY - LINUX FILESYSTEM MONITORING & AUTO REMEDIATION
# =========================================================
- name: Linux Filesystem Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no
  become: yes

  vars:
    filesystem_threshold: "{{ threshold | default(80) }}"

    allowed_cleanup_dirs:
      - "/tmp/fstest"
      - "/tmp"

    cleanup_pattern:
      - "*.bin"
      - "*.tmp"
      - "*.md"

  tasks:

    # =====================================================
    # FETCH CURRENT FILESYSTEM USAGE
    # =====================================================
    - name: Fetch highest filesystem usage
      shell: |
        df -hP | awk 'NR>1 {gsub("%","",$5); print $5}' | sort -nr | head -1
      register: fs_output
      changed_when: false

    - name: Set filesystem fact
      set_fact:
        filesystem_usage: "{{ fs_output.stdout | trim | float }}"

    # =====================================================
    # INITIALIZE VARIABLES
    # =====================================================
    - name: Initialize variables
      set_fact:
        cleanup_performed: false
        final_filesystem_usage: "{{ filesystem_usage }}"
        files_to_delete_list: []
        file_details: "None"
        action_details: ""

    # =====================================================
    # DISPLAY FILESYSTEM USAGE
    # =====================================================
    - name: Display filesystem usage
      debug:
        msg: "Current Filesystem Usage: {{ filesystem_usage }}%"

    # =====================================================
    # FIND FILES ELIGIBLE FOR CLEANUP
    # =====================================================
    - name: Find files eligible for cleanup
      find:
        paths: "{{ allowed_cleanup_dirs }}"
        patterns: "{{ cleanup_pattern }}"
        recurse: yes
        file_type: file
      register: files_to_delete
      when: filesystem_usage > filesystem_threshold

    # =====================================================
    # PREPARE FILE DETAILS
    # =====================================================
    - name: Prepare file details
      set_fact:
        file_details: >-
          {{
            (files_to_delete.files | map(attribute='path') | list) | join(' | ')
            if (files_to_delete.files | length > 0)
            else 'None'
          }}
        files_to_delete_list: "{{ files_to_delete.files | map(attribute='path') | list }}"
      when: filesystem_usage > filesystem_threshold

    # =====================================================
    # DISPLAY FILES FOR CLEANUP
    # =====================================================
    - name: Display files for cleanup
      debug:
        msg: "{{ item }}"
      loop: "{{ files_to_delete_list }}"
      when: files_to_delete_list | length > 0

    # =====================================================
    # DELETE FILES
    # =====================================================
    - name: Delete eligible files
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ files_to_delete_list }}"
      register: delete_output
      when: files_to_delete_list | length > 0

    # =====================================================
    # SET CLEANUP STATUS
    # =====================================================
    - name: Mark cleanup performed
      set_fact:
        cleanup_performed: true
      when: delete_output is defined

    - name: Prepare action details
      set_fact:
        action_details: >-
          {% if files_to_delete_list | length > 0 %}
          Deleted files: {{ files_to_delete_list | join(', ') }}
          {% else %}
          No eligible files found for cleanup
          {% endif %}

    # =====================================================
    # WAIT AFTER CLEANUP
    # =====================================================
    - name: Wait after cleanup
      pause:
        seconds: 5
      when: cleanup_performed | bool

    # =====================================================
    # RECHECK FILESYSTEM USAGE
    # =====================================================
    - name: Recheck filesystem usage
      shell: |
        df -hP | awk 'NR>1 {gsub("%","",$5); print $5}' | sort -nr | head -1
      register: fs_after
      changed_when: false
      when: cleanup_performed | bool

    - name: Set final filesystem usage
      set_fact:
        final_filesystem_usage: "{{ fs_after.stdout | trim | float }}"
      when: cleanup_performed | bool

    # =====================================================
    # FINAL STATUS & RESPONSE
    # =====================================================
    - name: Set final response
      set_fact:
        status_code: >-
          {{
            1 if (final_filesystem_usage | float) < (filesystem_threshold | float)
            else 2
          }}

        response_message: |
          {% if filesystem_usage | float < filesystem_threshold | float %}
          Current Filesystem utilization is {{ filesystem_usage }}%, which is within threshold {{ filesystem_threshold }}%.
          No action required. Closing the ticket.

          {% else %}

          {% if final_filesystem_usage | float < filesystem_threshold | float %}
          1. Filesystem Status: Issue Resolved After Remediation
          {% else %}
          1. Filesystem Status: Still High - Escalation Required
          {% endif %}

          2. Filesystem Usage Before Remediation: {{ filesystem_usage }}%

          3. Filesystem Usage After Remediation: {{ final_filesystem_usage }}%

          4. Files Identified For Cleanup: {{ file_details }}

          5. Action Taken: {{ action_details }}

          {% endif %}

    # =====================================================
    # DISPLAY FINAL RESULT
    # =====================================================
    - name: Display final response
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"

    # =====================================================
    # UPDATE IAUTOMATE STATUS
    # =====================================================
    - name: Update iautomate status
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        method: PUT
        user: "{{ iautomate_user }}"
        password: "{{ iautomate_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
        return_content: yes
        body_format: json
        body: "{{ lookup('template', 'status.json.j2') }}"
      delegate_to: localhost
      become: no
      register: status_update_iautomate