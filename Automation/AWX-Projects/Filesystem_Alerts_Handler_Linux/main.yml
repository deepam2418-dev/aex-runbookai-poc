---
- name: Filesystem_Alerts_Handler_Linux
  hosts: "{{ target_host | default(hostname) }}"
  gather_facts: false
  become: yes

  vars:
    status_code: 0
    response_message: "Automation execution is in progress."

    filesystem_threshold: "{{ threshold | default(80) }}"

    allowed_cleanup_dirs:
      - "/tmp/fstest"
      - "/tmp"

    cleanup_pattern:
      - "*.bin"
      - "*.tmp"
      - "*.md"

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution
      vars:
        status_code: "{{ status_code }}"
        response_message: "{{ response_message }}"

    - name: Filesystem alerts handler main block
      block:
        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - (target_host is defined and (target_host | string | length > 0)) or
                (hostname is defined and (hostname | string | length > 0))
              - filesystem_threshold is defined
              - (filesystem_threshold | float) > 0
              - (filesystem_threshold | float) < 100
            fail_msg: >-
              Required parameters are missing or invalid.
              Ensure target_host/hostname and filesystem_threshold (0 < threshold < 100)
              are correctly set.
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: >-
              Parameter validation completed successfully.
              Filesystem alerts handler is in progress with threshold
              {{ filesystem_threshold }}%.

        - name: Fetch highest filesystem usage
          ansible.builtin.shell: |
            df -hP | awk 'NR>1 {gsub("%","",$5); print $5}' | sort -nr | head -1
          register: fs_output
          changed_when: false

        - name: Set filesystem usage fact
          ansible.builtin.set_fact:
            filesystem_usage: "{{ fs_output.stdout | trim | float }}"

        - name: Update job status - filesystem usage fetched
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: >-
              Current filesystem usage is {{ filesystem_usage }}%.
              Threshold is {{ filesystem_threshold }}%.
              Evaluating need for cleanup.

        - name: Find files eligible for cleanup
          ansible.builtin.find:
            paths: "{{ allowed_cleanup_dirs }}"
            patterns: "{{ cleanup_pattern }}"
            recurse: yes
            file_type: file
          register: files_to_delete
          when: filesystem_usage > filesystem_threshold | float

        - name: Initialize intermediate variables
          ansible.builtin.set_fact:
            cleanup_performed: false
            final_filesystem_usage: "{{ filesystem_usage }}"
            files_to_delete_list: []
            file_details: "None"
            action_details: ""

        - name: Prepare file details
          ansible.builtin.set_fact:
            file_details: >-
              {{
                (files_to_delete.files | map(attribute='path') | list) | join(' | ')
                if (files_to_delete is defined and files_to_delete.files | length > 0)
                else 'None'
              }}
            files_to_delete_list: >-
              {{
                files_to_delete.files | map(attribute='path') | list
                if (files_to_delete is defined and files_to_delete.files | length > 0)
                else []
              }}
          when: filesystem_usage > filesystem_threshold | float

        - name: Update job status - files identified for cleanup
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: >-
              Filesystem usage is {{ filesystem_usage }}%, above threshold
              {{ filesystem_threshold }}%. Files identified for cleanup:
              {{ file_details }}.

        - name: Display files for cleanup
          ansible.builtin.debug:
            msg: "{{ item }}"
          loop: "{{ files_to_delete_list }}"
          when: files_to_delete_list | length > 0

        - name: Delete eligible files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ files_to_delete_list }}"
          register: delete_output
          when: files_to_delete_list | length > 0

        - name: Mark cleanup performed
          ansible.builtin.set_fact:
            cleanup_performed: true
          when: delete_output is defined

        - name: Prepare action details
          ansible.builtin.set_fact:
            action_details: >-
              {% if files_to_delete_list | length > 0 %}
              Deleted files: {{ files_to_delete_list | join(', ') }}
              {% else %}
              No eligible files found for cleanup
              {% endif %}

        - name: Update job status - cleanup step completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: >-
              Cleanup step completed. {{ action_details }}

        - name: Wait after cleanup
          ansible.builtin.pause:
            seconds: 5
          when: cleanup_performed | bool

        - name: Recheck filesystem usage
          ansible.builtin.shell: |
            df -hP | awk 'NR>1 {gsub("%","",$5); print $5}' | sort -nr | head -1
          register: fs_after
          changed_when: false
          when: cleanup_performed | bool

        - name: Set final filesystem usage
          ansible.builtin.set_fact:
            final_filesystem_usage: "{{ fs_after.stdout | trim | float }}"
          when: cleanup_performed | bool

        - name: Set final response
          ansible.builtin.set_fact:
            status_code: >-
              {{
                1
                if (filesystem_usage | float <= filesystem_threshold | float)
                else (
                  1 if (final_filesystem_usage | float) < (filesystem_threshold | float)
                  else 2
                )
              }}
            response_message: |-
              {% if filesystem_usage | float <= filesystem_threshold | float %}
              Current Filesystem utilization is {{ filesystem_usage }}%, which is within
              threshold {{ filesystem_threshold }}%. No action required. Closing the ticket.

              {% else %}

              {% if final_filesystem_usage | float < filesystem_threshold | float %}
              Filesystem Status: Issue Resolved After Remediation
              {% else %}
              Filesystem Status: Still High - Escalation Required
              {% endif %}

              Filesystem Usage Before Remediation: {{ filesystem_usage }}%
              Filesystem Usage After Remediation: {{ final_filesystem_usage }}%
              Files Identified For Cleanup: {{ file_details }}
              Action Taken: {{ action_details }}
              {% endif %}

        - name: Update job status - final response
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: >-
              Automation execution was not successful. The issue is being
              transferred for manual review. Error details: {{ fs_output.stderr | default('N/A') }}

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"