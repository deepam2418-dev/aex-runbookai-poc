# =========================================================
# PLAY - FILESYSTEM MONITORING & AUTO REMEDIATION
# =========================================================
- name: Filesystem Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  become: yes
  gather_facts: no

  vars:
    filesystem_threshold: "{{ threshold | default(80) }}"

    allowed_cleanup_dirs:
      - /var/log
      - /tmp

    cleanup_pattern:
      - "*.md"

  tasks:

    # =====================================================
    # FETCH CURRENT FILESYSTEM USAGE
    # =====================================================
    - name: Fetch highest filesystem usage
      shell: |
        df -hP | awk 'NR>1 {
          usage=$5
          gsub("%","",usage)
          print usage
        }' | sort -nr | head -1
      register: fs_output
      changed_when: false

    - name: Set filesystem fact
      set_fact:
        filesystem_usage: "{{ fs_output.stdout | trim | float | round(2) }}"

    # =====================================================
    # INITIALIZE VARIABLES
    # =====================================================
    - name: Initialize variables
      set_fact:
        final_filesystem_usage: "{{ filesystem_usage }}"
        exceeded_details: ""
        files_deleted: ""
        cleanup_performed: false

    # =====================================================
    # GET FILESYSTEMS EXCEEDING THRESHOLD
    # =====================================================
    - name: Get filesystems exceeding threshold
      shell: |
        df -hP | awk -v threshold="{{ filesystem_threshold }}" '
        NR>1 {
          usage=$5
          gsub("%","",usage)
          if (usage+0 > threshold+0)
            print $1, $5, $6
        }'
      register: exceeded_fs
      when: filesystem_usage > filesystem_threshold

    - name: Prepare exceeded filesystem details
      set_fact:
        exceeded_details: "{{ exceeded_fs.stdout_lines | join(' | ') if exceeded_fs.stdout_lines is defined else 'None' }}"
      when: filesystem_usage > filesystem_threshold

    # =====================================================
    # FIND FILES FOR CLEANUP
    # =====================================================
    - name: Find files eligible for cleanup
      find:
        paths: "{{ allowed_cleanup_dirs }}"
        patterns: "{{ cleanup_pattern }}"
        file_type: file
        recurse: yes
      register: files_to_delete
      when: filesystem_usage > filesystem_threshold

    - name: Prepare files list
      set_fact:
        files_deleted: >-
          {{
            files_to_delete.files | map(attribute='path') | join(', ')
            if files_to_delete.files is defined and files_to_delete.files | length > 0
            else 'No files found for cleanup'
          }}

    # =====================================================
    # DELETE FILES
    # =====================================================
    - name: Delete eligible files
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ files_to_delete.files }}"
      register: delete_output
      when:
        - filesystem_usage > filesystem_threshold
        - files_to_delete.files | length > 0

    - name: Set cleanup status
      set_fact:
        cleanup_performed: "{{ delete_output.changed | default(false) }}"

    # =====================================================
    # WAIT AFTER CLEANUP
    # =====================================================
    - name: Wait after cleanup
      pause:
        seconds: 10
      when: cleanup_performed | bool

    # =====================================================
    # RECHECK FILESYSTEM USAGE
    # =====================================================
    - name: Recheck filesystem usage
      shell: |
        df -hP | awk 'NR>1 {
          usage=$5
          gsub("%","",usage)
          print usage
        }' | sort -nr | head -1
      register: fs_after
      changed_when: false
      when: cleanup_performed | bool

    - name: Set final filesystem usage
      set_fact:
        final_filesystem_usage: "{{ fs_after.stdout | trim | float | round(2) }}"
      when: cleanup_performed | bool

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set status code
      set_fact:
        status_code: "{{ 1 if final_filesystem_usage < filesystem_threshold else 2 }}"

    # =====================================================
    # WORKNOTES (CPU-STYLE)
    # =====================================================
    - name: Set worknotes
      set_fact:
        worknotes: >-
          {{

            (
              'Current filesystem utilization on (' ~ hostname ~ ') is (' ~ filesystem_usage|string ~ '%).\n'
              ~ 'This is within the defined threshold of (' ~ filesystem_threshold|string ~ '%), so no action is required. Hence closing the ticket.'
            )

            if filesystem_usage < filesystem_threshold

            else

            (
              'Filesystem Status: Usage exceeded threshold (' ~ filesystem_threshold|string ~ '%)\n'
              ~ 'Host: ' ~ hostname ~ '\n'
              ~ 'Current Filesystem Utilization: ' ~ filesystem_usage|string ~ '%\n'
              ~ '1. Filesystem Usage Before Remediation: ' ~ filesystem_usage|string ~ '%\n'
              ~ '2. Filesystem Usage After Remediation: ' ~ final_filesystem_usage|string ~ '%\n'

              ~ '3. Affected Filesystems: '
              ~ (exceeded_details if exceeded_details != "" else 'NA') ~ '\n'

              ~ '4. Files Identified for Cleanup: '
              ~ (files_deleted if files_deleted != "" else 'NA') ~ '\n'

              ~ '5. Action Taken: '
              ~ (
                  'Cleanup performed successfully'
                  if cleanup_performed
                  else 'No files found for cleanup - escalation required'
                )

              ~ (
                  '\n6. Note: Filesystem usage is still high after remediation. Escalation required.'
                  if final_filesystem_usage > filesystem_threshold
                  else ''
                )
            )
          }}

    # =====================================================
    # RESPONSE MESSAGE (SHORT)
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {{
            (
              'Filesystem usage is within threshold. No action required.'
              if filesystem_usage < filesystem_threshold
              else
              (
                'Cleanup successful.'
                if final_filesystem_usage < filesystem_threshold
                else
                'Filesystem still high, escalation required.'
              )
            )
          }}

    # =====================================================
    # FINAL OUTPUT
    # =====================================================
    - name: Display final output
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
          worknotes: "{{ worknotes }}"
