# =========================================================
# PLAY - FILESYSTEM MONITORING & AUTO REMEDIATION
# =========================================================
- name: Filesystem Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  become: yes
  gather_facts: no

  vars:
    filesystem_threshold: "{{ threshold | default(80) | float }}"

    allowed_cleanup_dirs:
      - /var/log
      - /tmp

    cleanup_pattern:
      - "*.md"

  tasks:

    # =====================================================
    # FETCH CURRENT FILESYSTEM USAGE
    # =====================================================
    - name: Fetch highest filesystem usage
      shell: |
        df -hP | awk 'NR>1 {
          usage=$5
          gsub("%","",usage)
          print usage
        }' | sort -nr | head -1
      register: fs_output
      changed_when: false

    - name: Set filesystem fact
      set_fact:
        filesystem_usage: "{{ fs_output.stdout | trim | float }}"

    # =====================================================
    # INITIALIZE VARIABLES
    # =====================================================
    - name: Initialize variables
      set_fact:
        final_filesystem_usage: "{{ filesystem_usage }}"
        exceeded_details: ""
        files_deleted: ""
        cleanup_performed: false

    # =====================================================
    # GET FILESYSTEMS EXCEEDING THRESHOLD
    # =====================================================
    - name: Get filesystems exceeding threshold
      shell: |
        df -hP | awk -v threshold="{{ filesystem_threshold }}" '
        NR>1 {
          usage=$5
          gsub("%","",usage)
          if (usage+0 > threshold+0)
            print $1, $5, $6
        }'
      register: exceeded_fs
      when: filesystem_usage | float > filesystem_threshold | float

    - name: Prepare exceeded filesystem details
      set_fact:
        exceeded_details: "{{ exceeded_fs.stdout_lines | join(' | ') }}"
      when: filesystem_usage | float > filesystem_threshold | float

    # =====================================================
    # FIND FILES FOR CLEANUP
    # =====================================================
    - name: Find files eligible for cleanup
      find:
        paths: "{{ allowed_cleanup_dirs }}"
        patterns: "{{ cleanup_pattern }}"
        file_type: file
        recurse: yes
      register: files_to_delete
      when: filesystem_usage | float > filesystem_threshold | float

    - name: Prepare files list
      set_fact:
        files_deleted: >-
          {{
            files_to_delete.files | map(attribute='path') | join(', ')
            if files_to_delete.files is defined and files_to_delete.files | length > 0
            else 'NA'
          }}

    # =====================================================
    # DELETE FILES
    # =====================================================
    - name: Delete eligible files
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ files_to_delete.files }}"
      register: delete_output
      when:
        - filesystem_usage | float > filesystem_threshold | float
        - files_to_delete.files | length > 0

    - name: Set cleanup status
      set_fact:
        cleanup_performed: "{{ delete_output is defined and delete_output.changed }}"

    # =====================================================
    # WAIT AFTER CLEANUP
    # =====================================================
    - name: Wait after cleanup
      pause:
        seconds: 10
      when: cleanup_performed

    # =====================================================
    # RECHECK FILESYSTEM USAGE
    # =====================================================
    - name: Recheck filesystem usage
      shell: |
        df -hP | awk 'NR>1 {
          usage=$5
          gsub("%","",usage)
          print usage
        }' | sort -nr | head -1
      register: fs_after
      changed_when: false
      when: cleanup_performed

    - name: Set final filesystem usage
      set_fact:
        final_filesystem_usage: "{{ fs_after.stdout | trim | float }}"
      when: cleanup_performed

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set status code
      set_fact:
        status_code: "{{ 1 if cleanup_performed else 2 }}"

    # =====================================================
    # WORKNOTES ✅ FINAL LOGIC
    # =====================================================
    - name: Set worknotes
      set_fact:
        worknotes: >-
          {{
            (
              'Filesystem Status: Usage exceeded threshold (' ~ filesystem_threshold|string ~ '%)\n'
              ~ 'Host: ' ~ hostname ~ '\n'
              ~ 'Current Filesystem Utilization: ' ~ filesystem_usage|string ~ '%\n\n'

              ~ '1. Filesystem Usage Before Remediation: ' ~ filesystem_usage|string ~ '%\n'
              ~ '2. Filesystem Usage After Remediation: ' ~ final_filesystem_usage|string ~ '%\n\n'

              ~ '3. Affected Filesystems: ' ~ exceeded_details ~ '\n'
              ~ '4. Files Identified for Cleanup: ' ~ files_deleted ~ '\n\n'

              ~ '5. Action Taken: Cleanup performed successfully'
            )

            if cleanup_performed

            else

            (
              'Current filesystem utilization on (' ~ hostname ~ ') is (' ~ filesystem_usage|string ~ '%).\n'
              ~ 'This is within the defined threshold of (' ~ filesystem_threshold|string ~ '%), so no action is required. Hence closing the ticket.'
            )
          }}

    # =====================================================
    # RESPONSE MESSAGE ✅ FINAL
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {{
            (
              'Filesystem cleanup completed successfully.'
              if cleanup_performed
              else
              'Filesystem usage is within threshold. No action required. Ticket will be closed.'
            )
          }}

    # =====================================================
    # FINAL OUTPUT
    # =====================================================
    - name: Display final output
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
          worknotes: "{{ worknotes }}"
