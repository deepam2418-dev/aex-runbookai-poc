---
- name: Restart Apache service on Linux host
  hosts: "{{ target_host }}"
  gather_facts: yes
  vars:
    # Dynamic parameter: apache_service_name
    # Example values: "httpd" for RHEL/CentOS, "apache2" for Ubuntu/Debian
    apache_service_name: "{{ apache_service_name }}"

  tasks:
    - name: Initialize result variables
      set_fact:
        status_code: 2
        response_message: "Apache restart not attempted"

    - name: Validate that apache_service_name is provided
      assert:
        that:
          - apache_service_name is defined
          - apache_service_name | length > 0
        fail_msg: "apache_service_name variable is required and cannot be empty."
        success_msg: "apache_service_name is provided."

    - block:
        - name: Check if Apache service is installed
          ansible.builtin.service_facts:

        - name: Validate Apache service presence
          assert:
            that:
              - apache_service_name in ansible_facts.services
            fail_msg: "Service '{{ apache_service_name }}' not found on the target host."
            success_msg: "Service '{{ apache_service_name }}' is present on the target host."

        - name: Restart Apache service
          ansible.builtin.service:
            name: "{{ apache_service_name }}"
            state: restarted
          register: apache_restart_result

        - name: Set success status and message
          set_fact:
            status_code: 1
            response_message: >-
              Apache service '{{ apache_service_name }}' restarted successfully on host '{{ inventory_hostname }}'.
              Changed: {{ apache_restart_result.changed | default(false) }}

      rescue:
        - name: Capture failure message
          set_fact:
            status_code: 2
            response_message: >-
              Failed to restart Apache service '{{ apache_service_name }}' on host '{{ inventory_hostname }}'.
              Error: {{ ansible_failed_result.msg | default('Unknown error') }}

      always:
        - name: Display final status
          debug:
            msg:
              status_code: "{{ status_code }}"
              response_message: "{{ response_message }}"