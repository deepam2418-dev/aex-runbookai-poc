---
- name: Restart Apache service on Linux
  hosts: "{{ target_host }}"
  gather_facts: yes

  vars:
    # Dynamic parameter to choose the Apache service name if needed
    apache_service_name: ""

  tasks:
    - name: Determine Apache service name automatically if not provided
      set_fact:
        effective_apache_service_name: >-
          {{ apache_service_name
             if apache_service_name | trim | length > 0
             else (
               'httpd' if (ansible_facts.os_family | default('') == 'RedHat')
               else 'apache2'
             )
          }}

    - name: Restart Apache service
      block:
        - name: Restart Apache using service module
          ansible.builtin.service:
            name: "{{ effective_apache_service_name }}"
            state: restarted
          register: apache_restart_result

        - name: Set success result variables
          set_fact:
            status_code: 1
            response_message: >-
              Apache service '{{ effective_apache_service_name }}'
              restarted successfully on host '{{ inventory_hostname }}'.
      rescue:
        - name: Set failure result variables
          set_fact:
            status_code: 2
            response_message: >-
              Failed to restart Apache service on host '{{ inventory_hostname }}'.
              Error: {{ apache_restart_result.msg | default('Unknown error') }}

    - name: Display execution result
      ansible.builtin.debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"