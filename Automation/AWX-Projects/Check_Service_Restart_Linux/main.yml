---
- name: Check_Service_Restart_Linux
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    status_code: 0
    response_message: "Automation execution is in progress."
    service_name: ""

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution

    - name: Main automation block
      block:
        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - target_host | string | length > 0
              - service_name is defined
              - service_name | string | length > 0
            fail_msg: "Required parameter target_host or service_name is missing."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Check if service exists on Linux host
          ansible.builtin.shell: |
            systemctl status {{ service_name }}
          register: service_status
          ignore_errors: true

        - name: Update job status - service check completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Service check completed. Automation is still in progress."

        - name: Restart the service if it exists and not running
          when: "'inactive' in service_status.stdout or 'failed' in service_status.stdout"
          ansible.builtin.service:
            name: "{{ service_name }}"
            state: restarted

        - name: Update job status - service restart attempted
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Service restart attempted. Automation is still in progress."

        - name: Set successful resolution status if restart succeeded
          when: "'active (running)' in service_status.stdout"
          ansible.builtin.set_fact:
            status_code: 1
            response_message: "Automation completed successfully. The service was restarted and is running."

        - name: Update job status - successfully resolved
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: "Automation execution was not successful. The issue is being transferred for manual review."

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution