---
- name: Filesystem_Full_Check_Linux
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    # Mandatory status lifecycle variables
    status_code: 0
    response_message: "Automation execution is in progress."

    # Parameters with defaults
    threshold: 80          # configurable, 1–100
    max_items: 10          # top N items per filesystem

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution
      vars:
        status_code: "{{ status_code }}"
        response_message: "{{ response_message }}"

    - name: Main automation block
      block:

        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - (target_host | string | length) > 0
              - threshold is defined
              - (threshold | int) >= 1
              - (threshold | int) <= 100
              - max_items is defined
              - (max_items | int) > 0
            fail_msg: "Parameter validation failed. Ensure target_host, threshold (1-100), and max_items (>0) are set."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Collect filesystem usage (df -P)
          ansible.builtin.command: df -P
          register: df_output
          changed_when: false

        - name: Build structured list of filesystems
          ansible.builtin.set_fact:
            filesystems: "{{ filesystems | default([]) + [ {
              'filesystem': item.split()[0],
              'use_percent': (item.split()[4] | regex_replace('%','') | int),
              'mount_point': item.split()[5]
            } ] }}"
          loop: "{{ df_output.stdout_lines | reject('match', '^Filesystem') | list }}"

        - name: Filter filesystems above threshold
          ansible.builtin.set_fact:
            high_usage_filesystems: >-
              {{
                filesystems
                | selectattr('use_percent', '>=', threshold | int)
                | list
              }}

        - name: Handle case when no filesystems are above threshold
          when: high_usage_filesystems | length == 0
          block:
            - name: Set successful status - no high usage
              ansible.builtin.set_fact:
                status_code: 1
                response_message: "No filesystems are above the configured threshold of {{ threshold }}%. Automation completed successfully."

            - name: Job updates - no high-usage filesystems
              ansible.builtin.include_role:
                name: Job_Updates
              vars:
                status_code: "{{ status_code }}"
                response_message: "{{ response_message }}"

        - name: Analyze high usage filesystems - find top directories/files
          when: high_usage_filesystems | length > 0
          block:

            - name: Initialize list of analysis results
              ansible.builtin.set_fact:
                fs_analysis_results: []

            - name: Collect top items per high-usage filesystem
              ansible.builtin.shell: |
                set -o pipefail
                du -x -k {{ item.mount_point }} 2>/dev/null | sort -rn | head -n {{ max_items }}
              args:
                warn: false
              register: du_result
              loop: "{{ high_usage_filesystems }}"
              loop_control:
                loop_var: item
              changed_when: false

            - name: Build structured analysis results
              ansible.builtin.set_fact:
                fs_analysis_results: >-
                  {{
                    fs_analysis_results + [ {
                      'filesystem': item.filesystem,
                      'mount_point': item.mount_point,
                      'use_percent': item.use_percent,
                      'top_items_raw': (du_result.results[loop_index].stdout_lines | default([]))
                    } ]
                  }}
              loop: "{{ high_usage_filesystems }}"
              loop_control:
                loop_var: item
                index_var: loop_index

            - name: Display high-usage filesystems and top space consumers
              ansible.builtin.debug:
                var: fs_analysis_results

            - name: Set successful status - high usage analyzed
              ansible.builtin.set_fact:
                status_code: 1
                response_message: >-
                  Filesystems with usage >= {{ threshold }}% were analyzed.
                  Top {{ max_items }} space-consuming paths per filesystem have been reported.
                  Automation completed successfully.

            - name: Job updates - high usage analyzed
              ansible.builtin.include_role:
                name: Job_Updates
              vars:
                status_code: "{{ status_code }}"
                response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: "Automation execution was not successful. The issue is being transferred for manual review."

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"