---
- name: Service_Restart_Windows
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    status_code: 0
    response_message: "Automation execution is in progress."
    service_name: "{{ service_name }}"

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution

    - name: Main automation block
      block:
        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - target_host | string | length > 0
              - service_name is defined
              - service_name | string | length > 0
            fail_msg: "Required parameters target_host or service_name are missing."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Restart Windows service
          win_service:
            name: "{{ service_name }}"
            state: restarted

        - name: Check Windows service status after restart
          win_service_info:
            name: "{{ service_name }}"
          register: svc_status

        - name: Update job status - major automation step completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Service '{{ service_name }}' restart attempted. Checking status..."

        - name: Set successful resolution status if service is running
          ansible.builtin.set_fact:
            status_code: "{{ '1' if svc_status.services[0].state == 'running' else '-1' }}"
            response_message: >
              {% if svc_status.services[0].state == 'running' %}
                Automation completed successfully. Service '{{ service_name }}' is running.
              {% else %}
                Automation execution was not successful. Service '{{ service_name }}' is not running after restart.
              {% endif %}

        - name: Update job status - final result
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: "Automation execution was not successful. The issue is being transferred for manual review."

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution