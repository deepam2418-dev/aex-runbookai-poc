---
- name: User_Account_Creation_Linux
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    status_code: 0
    response_message: "Automation execution is in progress."

    user_name: "{{ user_name | default('testuser') }}"
    user_shell: "{{ user_shell | default('/bin/bash') }}"

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution
      vars:
        status_code: "{{ status_code }}"
        response_message: "{{ response_message }}"

    - name: Main automation block
      block:

        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - (target_host | string) | length > 0
              - user_name is defined
              - (user_name | string) | length > 0
            fail_msg: "Required parameters target_host or user_name are missing or invalid."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Ensure user exists on Linux host (idempotent ensure-present)
          ansible.builtin.user:
            name: "{{ user_name }}"
            shell: "{{ user_shell }}"
            state: present
          register: user_ensure_result

        - name: Update job status - user ensure-present step completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: >-
              User ensure-present step completed for '{{ user_name }}'.
              Automation is still in progress.

        - name: Set successful resolution status
          ansible.builtin.set_fact:
            status_code: 1
            response_message: >-
              Automation completed successfully. User '{{ user_name }}'
              exists on the target Linux host and the issue has been resolved.

        - name: Update job status - successfully resolved
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Capture failure details
          ansible.builtin.debug:
            msg: "User creation/ensure-present failed on target host."

        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: >-
              Automation execution was not successful for user '{{ user_name }}'.
              The issue is being transferred for manual review.

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"