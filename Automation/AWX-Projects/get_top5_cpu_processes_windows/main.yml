---
- name: Get top 5 CPU utilization processes on Windows
  hosts: "{{ target_host }}"
  gather_facts: no

  vars:
    # status_code: 1 = success, 2 = failure
    status_code: 0
    response_message: ""

  tasks:
    - name: Validate target host connectivity
      win_ping:
      register: ping_result
      ignore_unreachable: no

    - name: Fail if host is unreachable
      ansible.builtin.fail:
        msg: "Target host is unreachable. Cannot collect CPU utilization details."
      when: ping_result is failed

    - block:
        - name: Get top 5 CPU utilization processes using PowerShell
          win_shell: |
            Get-Process |
            Sort-Object -Property CPU -Descending |
            Select-Object -First 5 -Property Name, Id, CPU, PM, WS |
            ConvertTo-Json -Depth 3
          register: cpu_processes_raw

        - name: Parse CPU processes JSON
          ansible.builtin.set_fact:
            cpu_processes: "{{ cpu_processes_raw.stdout | from_json }}"

        - name: Show top 5 CPU utilization processes
          ansible.builtin.debug:
            msg:
              - "Top 5 CPU utilization processes on {{ inventory_hostname }}:"
              - "{{ cpu_processes }}"

        - name: Set success status and message
          ansible.builtin.set_fact:
            status_code: 1
            response_message: "Successfully retrieved top 5 CPU utilization processes from {{ inventory_hostname }}."
      rescue:
        - name: Set failure status and message
          ansible.builtin.set_fact:
            status_code: 2
            response_message: >-
              Failed to retrieve top 5 CPU utilization processes from {{ inventory_hostname }}.
              Error: {{ cpu_processes_raw.stderr if (cpu_processes_raw is defined and cpu_processes_raw.stderr is defined) else 'Unknown error' }}

        - name: Show failure message
          ansible.builtin.debug:
            msg: "{{ response_message }}"

    - name: Final status summary
      ansible.builtin.debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"