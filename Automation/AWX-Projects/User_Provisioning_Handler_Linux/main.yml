---
- name: User_Provisioning_Handler_Linux
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    status_code: 0
    response_message: "Automation execution is in progress."

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution

    - name: Main automation block - Linux user provisioning
      block:
        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - (target_host | string | length) > 0
              - user_name is defined
              - (user_name | string | length) > 0
            fail_msg: "Required parameters target_host and user_name must be provided."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Ensure Linux user exists
          ansible.builtin.user:
            name: "{{ user_name }}"
            state: present
            create_home: "{{ create_home | default(true) }}"
            shell: "{{ user_shell | default('/bin/bash') }}"
          register: user_result

        - name: Update job status - user provisioning step completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: >-
              Linux user '{{ user_name }}' provisioning step completed
              (changed={{ user_result.changed | default(false) }}). Automation is still in progress.

        - name: Set successful resolution status
          ansible.builtin.set_fact:
            status_code: 1
            response_message: >-
              Automation completed successfully. Linux user {{ user_name }}
              is present on target host {{ target_host }}.

        - name: Update job status - successfully resolved
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: >-
              Automation execution was not successful while provisioning Linux user '{{ user_name | default("N/A") }}'
              on host '{{ target_host | default("N/A") }}'. The issue is being transferred for manual review.

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution
