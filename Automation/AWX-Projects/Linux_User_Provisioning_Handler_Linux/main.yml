---
- name: Linux_User_Provisioning_Handler_Linux
  hosts: "{{ target_host }}"
  gather_facts: false
  become: true

  vars:
    # Mandatory status variables
    status_code: 0
    response_message: "Automation execution is in progress."

    # Functional parameters (to be passed from AWX)
    username: "{{ username | default('') }}"
    user_shell: "{{ user_shell | default('/bin/bash') }}"
    user_groups: "{{ user_groups | default('') }}"
    user_state: "{{ user_state | default('present') }}"  # present / absent

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution

    - name: Main automation block
      block:

        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - (target_host | string | length) > 0
              - username is defined
              - (username | string | length) > 0
            fail_msg: "Required parameters target_host and username must be provided and non-empty."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Set fact for user groups list
          ansible.builtin.set_fact:
            user_groups_list: >-
              {{ (user_groups | string | trim | length > 0)
                  | ternary(user_groups.split(','), []) }}

        - name: Ensure Linux user is in desired state
          ansible.builtin.user:
            name: "{{ username }}"
            state: "{{ user_state }}"
            shell: "{{ user_shell }}"
            groups: "{{ user_groups_list | default(omit) }}"
            append: true
          register: user_result

        - name: Update job status - user provisioning step completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: >-
              Linux user {{ username }} {{ 'ensured in state ' ~ user_state }}
              on host {{ inventory_hostname }}. Change status: {{ user_result.changed }}.

        - name: Set successful resolution status
          ansible.builtin.set_fact:
            status_code: 1
            response_message: >-
              Automation completed successfully. Linux user {{ username }}
              is in the desired state {{ user_state }} on host {{ inventory_hostname }}.

        - name: Update job status - successfully resolved
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: >-
              Automation execution was not successful while managing user {{ username }}
              on host {{ inventory_hostname | default(target_host, true) }}. The issue is being
              transferred for manual review. Check previous task output for details.

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution
