---
- name: Linux_User_Provisioning_Handler_Linux
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    # Mandatory status tracking
    status_code: 0
    response_message: "Automation execution is in progress."

    # Functional parameters
    linux_username: "{{ username | default('aex_user01') }}"
    linux_shell: "/bin/bash"

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution

    - name: Main automation block
      block:
        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - (target_host | string | length) > 0
              - linux_username is defined
              - (linux_username | string | length) > 0
            fail_msg: "Required parameters (target_host, linux_username) are missing or invalid."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Ensure Linux user is present
          ansible.builtin.user:
            name: "{{ linux_username }}"
            shell: "{{ linux_shell }}"
            state: present
            create_home: yes
          register: user_result

        - name: Update job status - user provisioning step completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: >-
              Linux user {{ linux_username }} provisioning step completed on host {{ target_host }}.
              Automation is still in progress.

        - name: Set successful resolution status
          ansible.builtin.set_fact:
            status_code: 1
            response_message: >-
              Automation completed successfully. Linux user {{ linux_username }}
              is provisioned on host {{ target_host }}.

        - name: Update job status - successfully resolved
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: >-
              Automation execution was not successful for Linux user {{ linux_username }}
              on host {{ target_host }}. The issue is being transferred for manual review.

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution
