# =========================================================
# PLAY - MEMORY MONITORING & AUTO REMEDIATION (LINUX)
# =========================================================
- name: Linux Memory Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  become: yes
  gather_facts: no

  vars:
    memory_threshold: "{{ threshold | default(80) }}"

    # Approved processes for auto remediation
    process_list:
      - testprocess

  tasks:

    # =====================================================
    # GET CURRENT MEMORY USAGE
    # =====================================================
    - name: Fetch current memory usage
      shell: |
        free | awk '/Mem:/ {printf("%.2f"), $3/$2 * 100}'
      register: memory_usage
      changed_when: false

    - name: Set memory value
      set_fact:
        memory_value: "{{ memory_usage.stdout | trim | float }}"

    - name: Display memory usage
      debug:
        msg: "Current Memory Usage: {{ memory_value }}%"

    # =====================================================
    # GET TOP MEMORY CONSUMING PROCESSES
    # =====================================================
    - name: Get top memory consuming processes
      shell: |
        ps -eo pid,comm,%mem --sort=-%mem | head -n 10
      register: top_memory_processes
      changed_when: false
      when:
        - (memory_value | float) > (memory_threshold | float)

    - name: Display top memory processes
      debug:
        var: top_memory_processes.stdout_lines
      when:
        - (memory_value | float) > (memory_threshold | float)

    # =====================================================
    # FILTER ONLY APPROVED PROCESSES
    # =====================================================
    - name: Filter approved processes
      set_fact:
        filtered_processes: >-
          {{
            top_memory_processes.stdout_lines[1:]
            | map('split')
            | selectattr('1', 'in', process_list)
            | list
          }}
      when:
        - (memory_value | float) > (memory_threshold | float)

    - name: Display filtered processes
      debug:
        msg: "{{ filtered_processes }}"
      when:
        - filtered_processes is defined

    # =====================================================
    # EXTRACT PROCESS DETAILS
    # =====================================================
    - name: Extract process PIDs
      set_fact:
        filtered_pids: "{{ filtered_processes | map('first') | list }}"
      when:
        - filtered_processes is defined

    - name: Extract process names
      set_fact:
        filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"
      when:
        - filtered_processes is defined

    - name: Display filtered PIDs
      debug:
        msg: "{{ filtered_pids }}"
      when:
        - filtered_pids is defined

    # =====================================================
    # KILL FILTERED HIGH MEMORY PROCESSES
    # =====================================================
    - name: Kill filtered high memory processes
      shell: "kill -9 {{ item }}"
      loop: "{{ filtered_pids }}"
      register: kill_results
      ignore_errors: yes
      when:
        - filtered_pids is defined
        - filtered_pids | length > 0

    - name: Set remediation status
      set_fact:
        process_killed: true
      when:
        - filtered_pids is defined
        - filtered_pids | length > 0

    - name: Set remediation skipped
      set_fact:
        process_killed: false
      when:
        - filtered_pids is not defined or filtered_pids | length == 0

    # =====================================================
    # WAIT FOR MEMORY STABILIZATION
    # =====================================================
    - name: Wait for memory stabilization
      pause:
        seconds: 10
      when:
        - process_killed | bool

    # =====================================================
    # RECHECK MEMORY USAGE
    # =====================================================
    - name: Fetch final memory usage
      shell: |
        free | awk '/Mem:/ {printf("%.2f"), $3/$2 * 100}'
      register: final_memory_usage
      changed_when: false

    - name: Set final memory value
      set_fact:
        final_memory_value: "{{ final_memory_usage.stdout | trim | float }}"

    - name: Display final memory usage
      debug:
        msg: "Final Memory Usage: {{ final_memory_value }}%"

    # =====================================================
    # SET STATUS CODE
    # =====================================================
    - name: Set final status code
      set_fact:
        status_code: >-
          {{
            1 if (final_memory_value | float) < (memory_threshold | float)
            else 2
          }}

    # =====================================================
    # SET RESPONSE MESSAGE
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {{

            (
              'Memory usage on host ' ~ hostname ~
              ' is currently at ' ~
              (memory_value | string) ~
              '%, which is within the configured threshold of ' ~
              (memory_threshold | string) ~
              '%. No remediation was required. Marking the ticket as resolved.'
            )

            if (memory_value | float) < (memory_threshold | float)

            else

            (

              (
                'Memory usage on host ' ~ hostname ~
                ' was initially detected at ' ~
                (memory_value | string) ~
                '%, exceeding the configured threshold of ' ~
                (memory_threshold | string) ~ '%. '
              )

              ~

              (
                'Approved high memory processes identified: ' ~
                (filtered_names | unique | join(', ')) ~ '. '
                if filtered_names is defined and filtered_names | length > 0
                else
                'No approved high memory processes were identified for remediation. '
              )

              ~

              (
                'Automation terminated the matching processes with PIDs: ' ~
                (filtered_pids | join(', ')) ~ '. '
                if filtered_pids is defined and filtered_pids | length > 0
                else
                ''
              )

              ~

              (
                'Post-remediation memory utilization is ' ~
                (final_memory_value | string) ~
                '%. Memory usage is now within acceptable limits. Marking the ticket as resolved.'
                if (final_memory_value | float) < (memory_threshold | float)
                else
                'Post-remediation memory utilization remains at ' ~
                (final_memory_value | string) ~
                '%, which is still above the configured threshold. Escalating the ticket for further investigation.'
              )

            )
          }}

    # =====================================================
    # DISPLAY FINAL RESPONSE
    # =====================================================
    - name: Display final response
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"

    # =====================================================
    # UPDATE IAUTOMATE STATUS
    # =====================================================
    - name: Update iautomate status
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        validate_certs: no
        user: "iautomate@syneoshealth.com"
        password: "Yy9%HyZW"
        method: PUT
        status_code: 200
        return_content: yes
        force_basic_auth: yes
        body_format: json
        body: "{{ lookup('template','status.json.j2') }}"
      delegate_to: localhost
      become: no
      register: status_update_iautomate