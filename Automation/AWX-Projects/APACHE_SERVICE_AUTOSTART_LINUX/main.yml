---
- name: Ensure Apache service is running; install if missing (RHEL-like)
  hosts: "{{ target_host }}"
  become: yes
  gather_facts: no

  vars:
    status_code: 1
    response_message: "Execution completed successfully - no action required for service management."

  tasks:
    - name: Gather current service facts
      ansible.builtin.service_facts:

    - name: Determine if Apache service is known on the system
      ansible.builtin.set_fact:
        apache_service_known: "{{ service_name in ansible_facts.services }}"
      failed_when: false

    - name: Install httpd package when service is not known (RHEL-like)
      ansible.builtin.yum:
        name: httpd
        state: present
      when: not apache_service_known
      register: httpd_install_result
      failed_when: false

    - name: Set status when httpd installation failed
      when:
        - not apache_service_known
        - httpd_install_result is defined
        - httpd_install_result.rc is defined
        - httpd_install_result.rc != 0
      ansible.builtin.set_fact:
        status_code: 2
        response_message: >-
          Service '{{ service_name }}' was not found and httpd installation failed.
          Return code: {{ httpd_install_result.rc }}.
          stderr: {{ httpd_install_result.stderr | default('N/A') }}.

    - name: Refresh service facts after install attempt
      ansible.builtin.service_facts:
      when:
        - not apache_service_known
        - (httpd_install_result is not defined)
          or (httpd_install_result.rc is not defined)
          or (httpd_install_result.rc == 0)

    - name: Determine if Apache service is known after install
      ansible.builtin.set_fact:
        apache_service_known_after_install: "{{ service_name in ansible_facts.services }}"
      when:
        - not apache_service_known
        - (httpd_install_result is not defined)
          or (httpd_install_result.rc is not defined)
          or (httpd_install_result.rc == 0)
      failed_when: false

    - name: Start and enable Apache service if installed successfully
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: started
        enabled: true
      when:
        - not apache_service_known
        - apache_service_known_after_install | default(false)
        - (httpd_install_result is not defined)
          or (httpd_install_result.rc is not defined)
          or (httpd_install_result.rc == 0)
      register: apache_start_after_install
      failed_when: false

    - name: Refresh service facts after start attempt (post-install)
      ansible.builtin.service_facts:
      when:
        - not apache_service_known
        - apache_service_known_after_install | default(false)
        - (httpd_install_result is not defined)
          or (httpd_install_result.rc is not defined)
          or (httpd_install_result.rc == 0)

    - name: Get Apache service state after install/start
      ansible.builtin.set_fact:
        apache_state_after_install: "{{ ansible_facts.services[service_name].state | default('unknown') }}"
      when:
        - not apache_service_known
        - apache_service_known_after_install | default(false)
        - (httpd_install_result is not defined)
          or (httpd_install_result.rc is not defined)
          or (httpd_install_result.rc == 0)

    - name: Set success status if service installed and running
      ansible.builtin.set_fact:
        status_code: 1
        response_message: >-
          Service '{{ service_name }}' was not found, has been installed (httpd),
          enabled, and started successfully. Current state: '{{ apache_state_after_install }}'.
      when:
        - not apache_service_known
        - apache_service_known_after_install | default(false)
        - apache_state_after_install is defined
        - apache_state_after_install == 'running'
        - (httpd_install_result is not defined)
          or (httpd_install_result.rc is not defined)
          or (httpd_install_result.rc == 0)

    - name: Set failure status if service failed to start after install
      ansible.builtin.set_fact:
        status_code: 2
        response_message: >-
          Service '{{ service_name }}' was not found. httpd was installed but the service
          is not running. Current state: '{{ apache_state_after_install | default('unknown') }}'.
      when:
        - not apache_service_known
        - apache_service_known_after_install | default(false)
        - apache_state_after_install is defined
        - apache_state_after_install != 'running'
        - (httpd_install_result is not defined)
          or (httpd_install_result.rc is not defined)
          or (httpd_install_result.rc == 0)

    - name: Get current state of Apache service (existing service path)
      ansible.builtin.set_fact:
        apache_current_state: "{{ ansible_facts.services[service_name].state | default('unknown') }}"
      when: apache_service_known

    - name: Service is already running - no action taken
      ansible.builtin.set_fact:
        status_code: 1
        response_message: "Service '{{ service_name }}' is already running. No restart performed."
      when:
        - apache_service_known
        - apache_current_state == 'running'

    - name: Start Apache service if it is not running
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: started
        enabled: true
      when:
        - apache_service_known
        - apache_current_state != 'running'
      register: apache_start_existing
      failed_when: false

    - name: Refresh service facts after start attempt (existing service)
      ansible.builtin.service_facts:
      when:
        - apache_service_known
        - apache_current_state != 'running'

    - name: Verify Apache service is running after start (existing service)
      ansible.builtin.set_fact:
        apache_new_state: "{{ ansible_facts.services[service_name].state | default('unknown') }}"
      when:
        - apache_service_known
        - apache_current_state != 'running'

    - name: Set success status if service is running after start (existing service)
      ansible.builtin.set_fact:
        status_code: 1
        response_message: "Service '{{ service_name }}' was not running and has been successfully started and enabled."
      when:
        - apache_service_known
        - apache_current_state != 'running'
        - apache_new_state == 'running'

    - name: Set failure status if service failed to start (existing service)
      ansible.builtin.set_fact:
        status_code: 2
        response_message: >-
          Service '{{ service_name }}' was not running and failed to start.
          Current state: '{{ apache_new_state | default('unknown') }}'.
      when:
        - apache_service_known
        - apache_current_state != 'running'
        - apache_new_state != 'running'

    - name: Final status output
      ansible.builtin.debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
