---
- name: Restart Apache httpd service on RHEL Linux
  hosts: "{{ target_host }}"
  become: yes
  gather_facts: yes

  vars:
    apache_service_name: "httpd"

  tasks:
    - name: Pre-check | Ensure we are on a RHEL-family system
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
        fail_msg: "This playbook only supports RHEL-family systems. Detected os_family={{ ansible_facts['os_family'] }}."
        success_msg: "RHEL-family system detected. Proceeding with Apache restart."

    - name: Pre-check | Check if Apache service is installed
      ansible.builtin.service_facts:

    - name: Validate | Ensure {{ apache_service_name }} service exists
      ansible.builtin.assert:
        that:
          - apache_service_name in ansible_facts['services']
        fail_msg: "Service '{{ apache_service_name }}' not found on this host. Please ensure Apache httpd is installed."
        success_msg: "Service '{{ apache_service_name }}' found on this host."

    - name: Restart | Restart Apache httpd service
      ansible.builtin.service:
        name: "{{ apache_service_name }}"
        state: restarted
      register: apache_restart_result
      failed_when:
        - apache_restart_result is failed

    - name: Post-check | Verify Apache httpd service is running
      ansible.builtin.service:
        name: "{{ apache_service_name }}"
        state: started
      register: apache_status

    - name: Validate | Ensure Apache httpd is in running state
      ansible.builtin.assert:
        that:
          - not apache_status is failed
        fail_msg: "Apache service '{{ apache_service_name }}' is not running after restart."
        success_msg: "Apache service '{{ apache_service_name }}' is running after restart."

    - name: Final status | Report success
      ansible.builtin.debug:
        msg:
          status_code: 0
          response_message: "Apache service '{{ apache_service_name }}' restarted successfully and is running."