# =========================================================
# CPU MONITORING & AUTO REMEDIATION (ENHANCED)
# =========================================================
- name: CPU Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no
  become: yes

  vars:
    cpu_threshold: "{{ threshold | default(80) }}"

    process_list:
      - dataprocess1
      - dataprocess
      - taniumclient.service
      - ir_agent
      - nxlog
      - mdatp.service

  tasks:

    # =====================================================
    # GET CURRENT CPU
    # =====================================================
    - name: Get current CPU usage
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: current_cpu
      changed_when: false

    - name: Set current CPU value
      set_fact:
        current_cpu_value: "{{ current_cpu.stdout | trim | float | round(2) }}"

    # =====================================================
    # INITIALIZE VARIABLES
    # =====================================================
    - name: Initialize variables
      set_fact:
        all_high_cpu: []
        approved_processes: []
        non_approved_processes: []
        killed_pids: []
        process_killed: false
        final_cpu_value: "{{ current_cpu_value }}"

    # =====================================================
    # GET HIGH CPU PROCESSES (PID NAME CPU)
    # =====================================================
    - name: Get high CPU processes
      shell: |
        ps -eo pid,comm,%cpu --no-headers | awk '$3 > {{ cpu_threshold }} {print $1 "|" $2 "|" $3}'
      register: high_cpu
      changed_when: false
      when:
        - current_cpu_value | float >= cpu_threshold | float

    - name: Set high CPU list
      set_fact:
        all_high_cpu: "{{ high_cpu.stdout_lines | default([]) }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # SPLIT & CLASSIFY PROCESSES
    # =====================================================
    - name: Classify processes
      set_fact:
        approved_processes: "{{ approved_processes + [item] if (item.split('|')[1] in process_list) else approved_processes }}"
        non_approved_processes: "{{ non_approved_processes + [item] if (item.split('|')[1] not in process_list) else non_approved_processes }}"
      loop: "{{ all_high_cpu }}"
      when:
        - all_high_cpu | length > 0

    # =====================================================
    # EXTRACT APPROVED PIDs
    # =====================================================
    - name: Extract approved PIDs
      set_fact:
        approved_pids: "{{ approved_processes | map('split','|') | map('first') | list }}"
      when:
        - approved_processes | length > 0

    # =====================================================
    # KILL APPROVED PROCESSES
    # =====================================================
    - name: Kill approved processes
      shell: "kill -9 {{ item }}"
      loop: "{{ approved_pids }}"
      register: kill_results
      ignore_errors: yes
      when:
        - approved_pids | length > 0

    - name: Set killed PIDs
      set_fact:
        killed_pids: "{{ approved_pids }}"
        process_killed: true
      when:
        - approved_pids | length > 0

    # =====================================================
    # RESTART DATAPROCESS
    # =====================================================
    - name: Restart dataprocess
      shell: nohup /home/svc_agenticai@ivhinc.com/script/dataprocess1.sh &
      when: process_killed

    - name: Wait for process restart
      pause:
        seconds: 10
      when: process_killed

    # =====================================================
    # RECHECK CPU
    # =====================================================
    - name: Get CPU after remediation
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: cpu_after
      changed_when: false
      when: process_killed

    - name: Set final CPU
      set_fact:
        final_cpu_value: "{{ cpu_after.stdout | trim | float | round(2) }}"
      when: process_killed

    # =====================================================
    # BUILD DETAILED WORKNOTES
    # =====================================================
    - name: Prepare worknotes
      set_fact:
        worknotes: >-
          CPU BEFORE: {{ current_cpu_value }}%
          
          {% if all_high_cpu | length > 0 %}
          HIGH CPU PROCESSES:
          {% for p in all_high_cpu %}
          - PID={{ p.split('|')[0] }} NAME={{ p.split('|')[1] }} CPU={{ p.split('|')[2] }}%
          {% endfor %}
          {% else %}
          No high CPU processes found
          {% endif %}

          APPROVED PROCESSES:
          {% if approved_processes | length > 0 %}
          {% for p in approved_processes %}
          - {{ p }}
          {% endfor %}
          {% else %}
          None
          {% endif %}

          NON-APPROVED PROCESSES (NOT KILLED):
          {% if non_approved_processes | length > 0 %}
          {% for p in non_approved_processes %}
          - {{ p }}
          {% endfor %}
          {% else %}
          None
          {% endif %}

          ACTION TAKEN:
          {% if killed_pids | length > 0 %}
          Killed PIDs: {{ killed_pids | join(', ') }}
          {% else %}
          No processes killed
          {% endif %}

          CPU AFTER: {{ final_cpu_value }}%

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set status code
      set_fact:
        status_code: >-
          {{
            1 if final_cpu_value | float < cpu_threshold | float else 2
          }}

    # =====================================================
    # FINAL RESPONSE
    # =====================================================
    - name: Display final output
      debug:
        msg:
          status_code: "{{ status_code }}"
          worknotes: "{{ worknotes }}"

    # =====================================================
    # IAUTOMATE UPDATE
    # =====================================================
    - name: Update iautomate
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        validate_certs: no
        user: "iautomate@syneoshealth.com"
        password: "Yy9%HyZW"
        method: PUT
        status_code: 200
        return_content: yes
        force_basic_auth: yes
        body_format: json
        body:
          status_code: "{{ status_code }}"
          worknotes: "{{ worknotes }}"
      delegate_to: localhost
      become: no
