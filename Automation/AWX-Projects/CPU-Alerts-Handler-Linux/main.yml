# =========================================================
# CPU MONITORING & AUTO REMEDIATION
# =========================================================
- name: CPU Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no
  become: yes

  vars:
    cpu_threshold: "{{ threshold | default(80) }}"

    process_list:
      - dataprocess1
      - dataprocess
      - taniumclient.service
      - ir_agent
      - nxlog
      - mdatp.service

  tasks:

    # =====================================================
    # CHECK CURRENT CPU USAGE
    # =====================================================
    - name: Get current CPU usage
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: current_cpu
      changed_when: false

    - name: Set current CPU value
      set_fact:
        current_cpu_value: "{{ current_cpu.stdout | trim | float | round(2) }}"

    - name: Display current CPU usage
      debug:
        msg: "Current CPU Usage: {{ current_cpu_value }}%"

    # =====================================================
    # DEFAULT VALUES
    # =====================================================
    - name: Initialize variables
      set_fact:
        filtered_processes: []
        filtered_pids: []
        filtered_names: []
        process_killed: false
        final_cpu_value: "{{ current_cpu_value }}"

        # ✅ NEW VARIABLES
        high_cpu_details: ""
        pid_details: ""
        action_details: ""
        cpu_after_details: ""

    # =====================================================
    # GET HIGH CPU PROCESSES
    # =====================================================
    - name: Get matching high CPU processes
      shell: |
        ps -eo pid,comm,%cpu --no-headers | awk '$3 > {{ cpu_threshold }} {print $1, $2, $3}'
      register: high_cpu
      changed_when: false
      when:
        - current_cpu_value | float >= cpu_threshold | float

    - name: Display high CPU processes
      debug:
        msg: "{{ high_cpu.stdout_lines }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # FILTER ONLY APPROVED PROCESSES
    # =====================================================
    - name: Filter only approved process names
      set_fact:
        filtered_processes: >-
          {{
            high_cpu.stdout_lines
            | map('split')
            | selectattr('1', 'in', process_list)
            | list
          }}
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # EXTRACT PROCESS DETAILS
    # =====================================================
    - name: Extract process PIDs
      set_fact:
        filtered_pids: "{{ filtered_processes | map('first') | list }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    - name: Extract process names
      set_fact:
        filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # ✅ NEW: PREPARE WORKNOTES DETAILS
    # =====================================================
    - name: Prepare high CPU details
      set_fact:
        high_cpu_details: "{{ high_cpu.stdout_lines | join(' | ') if high_cpu.stdout_lines is defined else 'No high CPU processes' }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    - name: Prepare PID details
      set_fact:
        pid_details: "{{ filtered_pids | join(', ') if filtered_pids | length > 0 else 'No PIDs identified' }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # KILL FILTERED HIGH CPU PROCESSES
    # =====================================================
    - name: Kill filtered high CPU processes
      shell: "kill -9 {{ item }}"
      loop: "{{ filtered_pids }}"
      register: kill_results
      ignore_errors: yes
      when:
        - current_cpu_value | float >= cpu_threshold | float
        - filtered_pids | length > 0

    # =====================================================
    # ✅ NEW: ACTION DETAILS
    # =====================================================
    - name: Prepare action details
      set_fact:
        action_details: >-
          {% if filtered_pids | length > 0 %}
          Killed processes: {{ filtered_pids | join(', ') }}
          {% else %}
          No approved processes found for termination
          {% endif %}

    # =====================================================
    # RESTART DATAPROCESS
    # =====================================================
    - name: Restart dataprocess
      shell: nohup /home/svc_agenticai@ivhinc.com/script/dataprocess1.sh &

    - name: Set remediation status
      set_fact:
        process_killed: true
      when:
        - filtered_pids | length > 0

    # =====================================================
    # WAIT
    # =====================================================
    - name: Wait for dataprocess startup
      pause:
        seconds: 10
      when:
        - process_killed | bool

    # =====================================================
    # RECHECK CPU
    # =====================================================
    - name: Get overall CPU usage after remediation
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: cpu_usage
      changed_when: false
      when:
        - process_killed | bool

    - name: Set final CPU value
      set_fact:
        final_cpu_value: "{{ cpu_usage.stdout | trim | float | round(2) }}"
      when:
        - process_killed | bool

    # =====================================================
    # ✅ NEW: CPU AFTER DETAILS
    # =====================================================
    - name: Prepare CPU after details
      set_fact:
        cpu_after_details: "Post action CPU utilization: {{ final_cpu_value }}%"

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set final status code
      set_fact:
        status_code: >-
          {{
            1
            if (final_cpu_value | float) < (cpu_threshold | float)
            else 2
          }}

    # =====================================================
    # RESPONSE MESSAGE (UPDATED)
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {% if current_cpu_value | float < cpu_threshold | float %}
          CPU {{ current_cpu_value }}% below threshold {{ cpu_threshold }}%. No action required.
          {% elif final_cpu_value | float < cpu_threshold | float %}
          CPU exceeded threshold. Processes: {{ filtered_names | join(', ') if filtered_names else 'None' }}. CPU normalized.
          {% else %}
          CPU still high after remediation. Escalation required.
          {% endif %}
          | High CPU: {{ high_cpu_details | default('NA') }}
          | PIDs: {{ pid_details | default('NA') }}
          | Action: {{ action_details | default('NA') }}
          | CPU After: {{ cpu_after_details | default('NA') }}

    # =====================================================
    # DISPLAY
    # =====================================================
    - name: Display final response
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"

    # =====================================================
    # IAUTOMATE UPDATE
    # =====================================================
    - name: Update iautomate url about status
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        validate_certs: no
        user: "iautomate@syneoshealth.com"
        password: "Yy9%HyZW"
        method: PUT
        status_code: 200
        return_content: yes
        force_basic_auth: yes
        body_format: json
        body: "{{ lookup('template','status.json.j2') }}"
      delegate_to: localhost
      become: no
      register: status_update_iautomate
