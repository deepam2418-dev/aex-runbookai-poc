# =========================================================
# CPU MONITORING & AUTO REMEDIATION
# =========================================================
- name: CPU Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no
  become: yes

  vars:
    cpu_threshold: "{{ threshold | default(80) }}"

    # Approved processes for auto remediation
    process_list:
      - dataprocess
      - testprocess

  tasks:

    # =====================================================
    # CHECK CURRENT CPU USAGE
    # =====================================================
    - name: Get current CPU usage
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: current_cpu
      changed_when: false

    - name: Set current CPU value
      set_fact:
        current_cpu_value: "{{ current_cpu.stdout | trim | float | round(2) }}"

    - name: Display current CPU usage
      debug:
        msg: "Current CPU Usage: {{ current_cpu_value }}%"

    # =====================================================
    # DEFAULT VALUES
    # =====================================================
    - name: Initialize variables
      set_fact:
        filtered_processes: []
        filtered_pids: []
        filtered_names: []
        process_killed: false
        final_cpu_value: "{{ current_cpu_value }}"

    # =====================================================
    # GET HIGH CPU PROCESSES
    # =====================================================
    - name: Get matching high CPU processes
      shell: |
        ps -eo pid,comm,%cpu --no-headers | awk '$3 > {{ cpu_threshold }} {print $1, $2, $3}'
      register: high_cpu
      changed_when: false
      when:
        - current_cpu_value | float >= cpu_threshold | float

    - name: Display high CPU processes
      debug:
        msg: "{{ high_cpu.stdout_lines }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # FILTER ONLY APPROVED PROCESSES
    # =====================================================
    - name: Filter only approved process names
      set_fact:
        filtered_processes: >-
          {{
            high_cpu.stdout_lines
            | map('split')
            | selectattr('1', 'in', process_list)
            | list
          }}
      when:
        - current_cpu_value | float >= cpu_threshold | float

    - name: Display filtered processes
      debug:
        msg: "{{ filtered_processes }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # EXTRACT PROCESS DETAILS
    # =====================================================
    - name: Extract process PIDs
      set_fact:
        filtered_pids: "{{ filtered_processes | map('first') | list }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    - name: Extract process names
      set_fact:
        filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    - name: Display filtered process IDs
      debug:
        msg: "{{ filtered_pids }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # KILL FILTERED HIGH CPU PROCESSES
    # =====================================================
    - name: Kill filtered high CPU processes
      shell: "kill -9 {{ item }}"
      loop: "{{ filtered_pids }}"
      register: kill_results
      ignore_errors: yes
      when:
        - current_cpu_value | float >= cpu_threshold | float
        - filtered_pids | length > 0

    # =====================================================
    # RESTART DATAPROCESS
    # =====================================================
    - name: Restart dataprocess
      shell: "/home/svc_agenticai@ivhinc.com/script/dataprocess.sh"
      register: restart_result
      when:
        - "'dataprocess' in filtered_names"

    - name: Display restart output
      debug:
        var: restart_result.stdout_lines
      when:
        - "'dataprocess' in filtered_names"

    - name: Set remediation status
      set_fact:
        process_killed: true
      when:
        - filtered_pids | length > 0

    # =====================================================
    # WAIT FOR PROCESS STARTUP
    # =====================================================
    - name: Wait for dataprocess startup
      pause:
        seconds: 10
      when:
        - process_killed | bool

    # =====================================================
    # RECHECK CPU AFTER REMEDIATION
    # =====================================================
    - name: Get overall CPU usage after remediation
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: cpu_usage
      changed_when: false
      when:
        - process_killed | bool

    - name: Set final CPU value
      set_fact:
        final_cpu_value: "{{ cpu_usage.stdout | trim | float | round(2) }}"
      when:
        - process_killed | bool

    - name: Print final CPU usage
      debug:
        msg: "Current CPU Usage: {{ final_cpu_value }}%"

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set final status code
      set_fact:
        status_code: >-
          {{
            1
            if (final_cpu_value | float) < (cpu_threshold | float)
            else 2
          }}

    # =====================================================
    # RESPONSE MESSAGE
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {% if current_cpu_value | float < cpu_threshold | float %}
          Current CPU utilization on host {{ hostname }} is {{ current_cpu_value }}%, which is below the configured threshold of {{ cpu_threshold }}%. No remediation was required. Marking the ticket as resolved.
          {% elif final_cpu_value | float < cpu_threshold | float %}
          CPU usage on host {{ hostname }} exceeded the configured threshold of {{ cpu_threshold }}%. Approved high CPU processes identified: {{ filtered_names | unique | join(', ') if filtered_names | length > 0 else 'None' }}. Post-remediation CPU utilization is {{ final_cpu_value }}%. CPU utilization returned to normal levels. Marking the ticket as resolved.
          {% else %}
          CPU usage on host {{ hostname }} exceeded the configured threshold of {{ cpu_threshold }}%. Approved high CPU processes identified: {{ filtered_names | unique | join(', ') if filtered_names | length > 0 else 'None' }}. Post-remediation CPU utilization remains at {{ final_cpu_value }}%, which is still above threshold. Escalating the ticket for further investigation.
          {% endif %}

    # =====================================================
    # DISPLAY FINAL RESPONSE
    # =====================================================
    - name: Display final response
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"

    # =====================================================
    # UPDATE IAUTOMATE STATUS
    # =====================================================
    - name: Update iautomate url about status
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        validate_certs: no
        user: "iautomate@syneoshealth.com"
        password: "Yy9%HyZW"
        method: PUT
        status_code: 200
        return_content: yes
        force_basic_auth: yes
        body_format: json
        body: "{{ lookup('template','status.json.j2') }}"
      delegate_to: localhost
      become: no
      register: status_update_iautomate