# =========================================================
# CPU MONITORING & AUTO REMEDIATION (FIXED FORMAT)
# =========================================================
- name: CPU Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no
  become: yes

  vars:
    cpu_threshold: "{{ threshold | default(80) }}"

    process_list:
      - dataprocess1
      - dataprocess
      - taniumclient.service
      - ir_agent
      - nxlog
      - mdatp.service

  tasks:

    # =====================================================
    # CPU BEFORE
    # =====================================================
    - name: Get CPU before
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: cpu_before
      changed_when: false

    - name: Set CPU before
      set_fact:
        cpu_before_value: "{{ cpu_before.stdout | trim | float | round(2) }}"

    # =====================================================
    # GET HIGH CPU PROCESSES
    # =====================================================
    - name: Get high CPU processes
      shell: |
        ps -eo pid,comm,%cpu --no-headers | awk '$3 > {{ cpu_threshold }} {print $1 "|" $2 "|" $3}'
      register: high_cpu
      changed_when: false
      when: cpu_before_value | float >= cpu_threshold

    - name: Set high CPU list
      set_fact:
        all_high_cpu: "{{ high_cpu.stdout_lines | default([]) }}"

    # =====================================================
    # CLASSIFY PROCESSES
    # =====================================================
    - name: Initialize lists
      set_fact:
        approved_list: []
        non_approved_list: []

    - name: Separate approved and non-approved
      set_fact:
        approved_list: "{{ approved_list + [item] if (item.split('|')[1] in process_list) else approved_list }}"
        non_approved_list: "{{ non_approved_list + [item] if (item.split('|')[1] not in process_list) else non_approved_list }}"
      loop: "{{ all_high_cpu }}"
      when: all_high_cpu | length > 0

    # =====================================================
    # EXTRACT PIDs
    # =====================================================
    - name: Extract approved PIDs
      set_fact:
        approved_pids: "{{ approved_list | map('split','|') | map('first') | list }}"
      when: approved_list | length > 0

    # =====================================================
    # KILL APPROVED
    # =====================================================
    - name: Kill processes
      shell: "kill -9 {{ item }}"
      loop: "{{ approved_pids }}"
      ignore_errors: yes
      when: approved_pids | length > 0

    - name: Set killed flag
      set_fact:
        killed_pids: "{{ approved_pids | default([]) }}"

    # =====================================================
    # RESTART PROCESS
    # =====================================================
    - name: Restart dataprocess
      shell: nohup /home/svc_agenticai@ivhinc.com/script/dataprocess1.sh &
      when: killed_pids | length > 0

    - name: Wait
      pause:
        seconds: 10
      when: killed_pids | length > 0

    # =====================================================
    # CPU AFTER
    # =====================================================
    - name: Get CPU after
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: cpu_after
      changed_when: false

    - name: Set CPU after
      set_fact:
        cpu_after_value: "{{ cpu_after.stdout | trim | float | round(2) }}"

    # =====================================================
    # FORMAT OUTPUT CORRECTLY (MAIN FIX)
    # =====================================================
    - name: Build HIGH CPU lines
      set_fact:
        high_cpu_lines: >-
          {{
            all_high_cpu
            | map('regex_replace', '^(\\d+)\\|(.*?)\\|(.*)$', '- PID=\\1 NAME=\\2 CPU=\\3%')
            | list
          }}

    - name: Build APPROVED lines
      set_fact:
        approved_lines: "{{ approved_list | map('regex_replace', '^(.*)$', '- \\1') | list }}"

    - name: Build NON-APPROVED lines
      set_fact:
        non_approved_lines: "{{ non_approved_list | map('regex_replace', '^(.*)$', '- \\1') | list }}"

    # =====================================================
    # FINAL WORKNOTES (CORRECT STRUCTURE)
    # =====================================================
    - name: Prepare worknotes
      set_fact:
        worknotes: "{{ [
          'CPU BEFORE: ' ~ cpu_before_value ~ '%',
          '',
          'HIGH CPU PROCESSES:'
        ]
        + (high_cpu_lines if high_cpu_lines | length > 0 else ['No high CPU processes'])
        + [
          '',
          'APPROVED PROCESSES:'
        ]
        + (approved_lines if approved_lines | length > 0 else ['None'])
        + [
          '',
          'NON-APPROVED PROCESSES (NOT KILLED):'
        ]
        + (non_approved_lines if non_approved_lines | length > 0 else ['None'])
        + [
          '',
          'ACTION TAKEN:',
          ("Killed PIDs: " ~ (killed_pids | join(', ')) if killed_pids | length > 0 else 'No processes killed'),
          '',
          'CPU AFTER: ' ~ cpu_after_value ~ '%'
        ]
        | join('\n') }}"

    # =====================================================
    # STATUS
    # =====================================================
    - name: Set status
      set_fact:
        status_code: "{{ 1 if cpu_after_value < cpu_threshold else 2 }}"

    # =====================================================
    # DEBUG
    # =====================================================
    - name: Show output
      debug:
        msg:
          status_code: "{{ status_code }}"
          worknotes: "{{ worknotes }}"

    # =====================================================
    # IAUTOMATE UPDATE
    # =====================================================
    - name: Update iautomate
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        method: PUT
        user: "iautomate@syneoshealth.com"
        password: "Yy9%HyZW"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          status_code: "{{ status_code }}"
          worknotes: "{{ worknotes }}"
        status_code: 200
      delegate_to: localhost
