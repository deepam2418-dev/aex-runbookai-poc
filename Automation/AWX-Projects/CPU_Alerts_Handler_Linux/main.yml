# =========================================================
# PLAY - CPU MONITORING & AUTO REMEDIATION (LINUX)
# =========================================================
- name: Linux CPU Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  become: yes
  gather_facts: no

  vars:
    cpu_threshold: "{{ threshold | default(80) }}"

    process_list:
      - dataprocess1
      - dataprocess
      - taniumclient.service
      - ir_agent
      - nxlog
      - mdatp.service

  tasks:

    # =====================================================
    # GET CURRENT CPU USAGE
    # =====================================================
    - name: Fetch current CPU usage
      shell: top -bn1 | grep "Cpu(s)" | awk '{print 100 - $8}'
      register: cpu_usage
      changed_when: false

    - name: Set CPU value
      set_fact:
        cpu_value: "{{ cpu_usage.stdout | trim | float }}"

    # =====================================================
    # GET TOP CPU PROCESSES
    # =====================================================
    - name: Get top CPU consuming processes
      shell: ps -eo pid,comm,%cpu --sort=-%cpu | head -n 10
      register: top_cpu_processes
      changed_when: false
      when: cpu_value > cpu_threshold

    # =====================================================
    # FILTER APPROVED PROCESSES
    # =====================================================
    - name: Filter approved processes
      set_fact:
        filtered_processes: >-
          {{
            top_cpu_processes.stdout_lines[1:]
            | map('split')
            | selectattr('1', 'in', process_list)
            | list
          }}
      when: cpu_value > cpu_threshold

    - name: Extract PIDs
      set_fact:
        filtered_pids: "{{ filtered_processes | map('first') | list }}"
      when: filtered_processes is defined

    - name: Extract process names
      set_fact:
        filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"
      when: filtered_processes is defined

    # =====================================================
    # KILL PROCESSES
    # =====================================================
    - name: Kill filtered processes
      shell: kill -9 {{ item }}
      loop: "{{ filtered_pids }}"
      ignore_errors: yes
      when:
        - filtered_pids is defined
        - filtered_pids | length > 0
      register: kill_results

    - name: Set remediation status
      set_fact:
        process_killed: "{{ filtered_pids is defined and filtered_pids | length > 0 }}"

    # =====================================================
    # WAIT
    # =====================================================
    - name: Wait 10 seconds
      pause:
        seconds: 10
      when: process_killed

    # =====================================================
    # FINAL CPU CHECK
    # =====================================================
    - name: Get final CPU usage
      shell: top -bn1 | grep "Cpu(s)" | awk '{print 100 - $8}'
      register: final_cpu_usage
      changed_when: false

    - name: Set final CPU value
      set_fact:
        final_cpu_value: "{{ final_cpu_usage.stdout | trim | float }}"

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set status code
      set_fact:
        status_code: "{{ 1 if final_cpu_value < cpu_threshold else 2 }}"

    # =====================================================
    # ESCALATION CHECK
    # =====================================================
    - name: Set escalation flag
      set_fact:
        escalation_required: true
      when:
        - cpu_value > cpu_threshold
        - filtered_pids | default([]) | length == 0

    # =====================================================
    # WORKNOTES (UPDATED)
    # =====================================================
    - name: Set worknotes
      set_fact:
        worknotes: >-
          {{

            (
              'Current CPU utilization on (' ~ hostname ~ ') is (' ~ cpu_value|string ~ '%).\n'
              ~ 'This is within the defined threshold of (' ~ cpu_threshold|string ~ '%), so no action is required. Hence closing the ticket.'
            )

            if cpu_value < cpu_threshold

            else

            (
              'CPU Status: CPU exceeded threshold (' ~ cpu_threshold|string ~ '%)\n'
              ~ 'Host: ' ~ hostname ~ '\n'
              ~ 'Current CPU Utilization: ' ~ cpu_value|string ~ '%\n'
              ~ '1. CPU Usage Before Remediation: ' ~ cpu_value|string ~ '%\n'
              ~ '2. CPU Usage After Remediation: ' ~ final_cpu_value|string ~ '%\n'

              ~ '3. High CPU Processes: '
              ~ (filtered_names | join(', ') if filtered_names is defined and filtered_names|length > 0 else 'NA') ~ '\n'

              ~ '4. Process IDs: '
              ~ (filtered_pids | join(', ') if filtered_pids is defined and filtered_pids|length > 0 else 'NA') ~ '\n'

              ~ '5. Action Taken: '
              ~ (
                  'Processes terminated successfully'
                  if process_killed
                  else 'No approved process found - escalation required'
                )

              ~ (
                  '\n6. Note: CPU utilization is still high after remediation. Escalation required.'
                  if final_cpu_value > cpu_threshold
                  else ''
                )
            )
          }}

    # =====================================================
    # RESPONSE MESSAGE (UPDATED)
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {{
            (
              'Current CPU utilization is (' ~ cpu_value|string ~ '%) which is within the defined threshold (' ~ cpu_threshold|string ~ '%). No action required, ticket will be closed.'
              if cpu_value < cpu_threshold
              else
              (
                'CPU exceeded threshold. '
                ~ (
                    'Issue escalated due to unknown processes.'
                    if escalation_required | default(false)
                    else
                    (
                      'Remediation successful.'
                      if final_cpu_value < cpu_threshold
                      else
                      'CPU still high after remediation. Escalation required.'
                    )
                  )
              )
            )
          }}

    # =====================================================
    # FINAL OUTPUT
    # =====================================================
    - name: Display final output
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
          worknotes: "{{ worknotes }}"

    # =====================================================
    # IAUTOMATE UPDATE
    # =====================================================
    - name: Update iautomate status
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        validate_certs: no
        user: "iautomate@syneoshealth.com"
        password: "Yy9%HyZW"
        method: PUT
        status_code: 200
        return_content: yes
        force_basic_auth: yes
        body_format: json
        body: "{{ lookup('template','status.json.j2') }}"
      delegate_to: localhost
      become: no
      register: status_update_iautomate
