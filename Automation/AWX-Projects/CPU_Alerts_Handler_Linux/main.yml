# =========================================================
# CPU MONITORING & AUTO REMEDIATION
# =========================================================
- name: CPU Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no
  become: yes

  vars:
    cpu_threshold: "{{ threshold | default(80) }}"

    process_list:
      - dataprocess1
      - dataprocess
      - taniumclient.service
      - ir_agent
      - nxlog
      - mdatp.service

  tasks:

    # =====================================================
    # CHECK CURRENT CPU USAGE
    # =====================================================
    - name: Get current CPU usage
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: current_cpu
      changed_when: false

    - name: Set current CPU value
      set_fact:
        current_cpu_value: "{{ current_cpu.stdout | trim | float | round(2) }}"

    # =====================================================
    # INITIALIZE VARIABLES (DEFAULT NA)
    # =====================================================
    - name: Initialize variables
      set_fact:
        filtered_processes: []
        filtered_pids: []
        filtered_names: []
        process_killed: false
        final_cpu_value: "NA"
        high_cpu_details: "NA"
        pid_details: "NA"
        action_details: "NA"
        approved_processes: "NA"
        non_approved_processes: "NA"

    # =====================================================
    # EXECUTE ONLY IF CPU HIGH
    # =====================================================
    - block:

        - name: Get high CPU processes
          shell: |
            ps -eo pid,comm,%cpu --no-headers | awk '$3 > {{ cpu_threshold }} {print $1, $2, $3}'
          register: high_cpu
          changed_when: false

        - name: Set high CPU details
          set_fact:
            high_cpu_details: "{{ high_cpu.stdout_lines | join(' | ') if high_cpu.stdout_lines|length > 0 else 'NA' }}"

        - name: Filter approved processes
          set_fact:
            filtered_processes: >-
              {{
                high_cpu.stdout_lines
                | map('split')
                | selectattr('1', 'in', process_list)
                | list
              }}

        - name: Extract PID and names
          set_fact:
            filtered_pids: "{{ filtered_processes | map('first') | list }}"
            filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"

        - name: Prepare outputs
          set_fact:
            pid_details: "{{ filtered_pids | join(', ') if filtered_pids|length>0 else 'NA' }}"
            approved_processes: "{{ filtered_names | unique | join(', ') if filtered_names|length>0 else 'NA' }}"
            non_approved_processes: >-
              {{
                high_cpu.stdout_lines
                | map('split')
                | map(attribute=1)
                | difference(process_list)
                | unique
                | join(', ')
                if high_cpu.stdout_lines|length > 0 else 'NA'
              }}

        - name: Kill processes
          shell: "kill -9 {{ item }}"
          loop: "{{ filtered_pids }}"
          ignore_errors: yes
          when: filtered_pids | length > 0

        - name: Restart service
          shell: nohup /home/svc_agenticai@ivhinc.com/script/dataprocess1.sh &
          when: filtered_pids | length > 0

        - name: Set remediation flag
          set_fact:
            process_killed: true
          when: filtered_pids | length > 0

        - name: Set action details
          set_fact:
            action_details: >-
              {% if filtered_pids | length > 0 %}
              Killed processes: {{ filtered_pids | join(', ') }}
              {% else %}
              No approved processes found for termination
              {% endif %}

      when: current_cpu_value | float >= cpu_threshold | float


    # =====================================================
    # WAIT & RECHECK ONLY IF REMEDIATION
    # =====================================================
    - name: Wait
      pause:
        seconds: 10
      when: process_killed

    - name: Get CPU after remediation
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: cpu_usage
      changed_when: false
      when: process_killed

    - name: Set final CPU value
      set_fact:
        final_cpu_value: "{{ cpu_usage.stdout | trim | float | round(2) }}"
      when: process_killed

    # =====================================================
    # FIX FOR NO REMEDIATION CASE 
    # =====================================================
    - name: Force NA when no remediation
      set_fact:
        final_cpu_value: "NA"
        high_cpu_details: "NA"
        approved_processes: "NA"
        non_approved_processes: "NA"
        pid_details: "NA"
        action_details: "No action was taken because no remediation done"
      when: not process_killed

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set status
      set_fact:
        status_code: >-
          {{
            1 if (process_killed and (final_cpu_value | float < cpu_threshold))
            else 1 if not process_killed
            else 2
          }}

    # =====================================================
    # FINAL RESPONSE CLEAN OUTPUT
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {% if not process_killed %}
          1. CPU Status: CPU Utilization is within acceptable threshold. No remediation required.

          {% elif final_cpu_value | float < cpu_threshold | float %}
          1. CPU Status: High CPU utilization detected and successfully reduced after remediation.

          {% else %}
          1. CPU Status: High CPU utilization persists even after remediation. Escalation required.

          {% endif %}
          2. CPU Usage Before Remediation: {{ current_cpu_value }}%

          3. CPU Usage After Remediation: {{ final_cpu_value }}

          4. High CPU Processes: {{ high_cpu_details }}

          5. Approved Processes: {{ approved_processes }}

          6. Non-Approved Processes: {{ non_approved_processes }}

          7. Process IDs (PIDs): {{ pid_details }}

          8. Action Taken: {{ action_details }}

    # =====================================================
    # OUTPUT
    # =====================================================
    - name: Output
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
