# =========================================================
# CPU MONITORING & AUTO REMEDIATION
# =========================================================
- name: CPU Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no
  become: yes

  vars:
    cpu_threshold: "{{ threshold | default(80) }}"

    process_list:
      - dataprocess1
      - dataprocess
      - taniumclient.service
      - ir_agent
      - nxlog
      - mdatp.service

  tasks:

    # =====================================================
    # CHECK CURRENT CPU USAGE
    # =====================================================
    - name: Get current CPU usage
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: current_cpu
      changed_when: false

    - name: Set current CPU value
      set_fact:
        current_cpu_value: "{{ current_cpu.stdout | trim | float | round(2) }}"

    # =====================================================
    # INITIALIZE VARIABLES
    # =====================================================
    - name: Initialize variables
      set_fact:
    filtered_processes: []
    filtered_pids: []
    filtered_names: []
    process_killed: false
    final_cpu_value: "{{ current_cpu_value }}"
    high_cpu_details: "NA"
    pid_details: "NA"
    action_details: "No action was taken because no remediation done"
    approved_processes: "NA"
    non_approved_processes: "NA"
    # =====================================================
    # GET HIGH CPU PROCESSES
    # =====================================================
    - name: Get matching high CPU processes
      shell: |
        ps -eo pid,comm,%cpu --no-headers | awk '$3 > {{ cpu_threshold }} {print $1, $2, $3}'
      register: high_cpu
      changed_when: false
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # STORE HIGH CPU DETAILS
    # =====================================================
    - name: Prepare high CPU details
      set_fact:
        high_cpu_details: "{{ high_cpu.stdout_lines | join(' | ') }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float
        - high_cpu.stdout_lines | length > 0

    # =====================================================
    # FILTER APPROVED PROCESSES
    # =====================================================
    - name: Filter only approved process names
      set_fact:
        filtered_processes: >-
          {{
            high_cpu.stdout_lines
            | map('split')
            | selectattr('1', 'in', process_list)
            | list
          }}
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # EXTRACT DETAILS
    # =====================================================
    - name: Extract process PIDs
      set_fact:
        filtered_pids: "{{ filtered_processes | map('first') | list }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    - name: Extract process names
      set_fact:
        filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # PID DETAILS
    # =====================================================
    - name: Prepare PID details
      set_fact:
        pid_details: "{{ filtered_pids | join(', ') if filtered_pids | length > 0 else 'NA' }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # CLASSIFY APPROVED / NON-APPROVED
    # =====================================================
    - name: Approved processes
      set_fact:
        approved_processes: "{{ filtered_names | unique | join(', ') if filtered_names | length > 0 else 'NA' }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float

    - name: Non-approved processes
      set_fact:
        non_approved_processes: >-
          {{
            high_cpu.stdout_lines
            | map('split')
            | map(attribute=1)
            | difference(process_list)
            | unique
            | join(', ')
            if high_cpu.stdout_lines | length > 0 else 'NA'
          }}
      when:
        - current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # KILL PROCESSES
    # =====================================================
    - name: Kill filtered high CPU processes
      shell: "kill -9 {{ item }}"
      loop: "{{ filtered_pids }}"
      ignore_errors: yes
      when:
        - current_cpu_value | float >= cpu_threshold | float
        - filtered_pids | length > 0

    # =====================================================
    # ACTION DETAILS
    # =====================================================
    - name: Prepare action details
      set_fact:
        action_details: >-
          {% if current_cpu_value < cpu_threshold %}
          CPU Utilization is within acceptable threshold. No remediation required.
          {% elif filtered_pids | length > 0 %}
          Killed processes: {{ filtered_pids | join(', ') }}
          {% else %}
          No approved processes found for termination
          {% endif %}

    # =====================================================
    # RESTART SERVICE
    # =====================================================
    - name: Restart dataprocess
      shell: nohup /home/svc_agenticai@ivhinc.com/script/dataprocess1.sh &
      when:
        - filtered_pids | length > 0

    - name: Set remediation status
      set_fact:
        process_killed: true
      when:
        - filtered_pids | length > 0

    # =====================================================
    # WAIT
    # =====================================================
    - name: Wait for startup
      pause:
        seconds: 10
      when:
        - process_killed | bool

    # =====================================================
    # RECHECK CPU
    # =====================================================
    - name: Get CPU after remediation
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: cpu_usage
      changed_when: false
      when:
        - process_killed | bool

    - name: Set final CPU value
      set_fact:
        final_cpu_value: "{{ cpu_usage.stdout | trim | float | round(2) }}"
      when:
        - process_killed | bool

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set status
      set_fact:
        status_code: >-
          {{
            0 if (current_cpu_value < cpu_threshold)
            else (1 if final_cpu_value < cpu_threshold else 2)
          }}

    # =====================================================
    # FINAL RESPONSE (WORKNOTE FIXED)
    # =====================================================
    - name: Set response message
  set_fact:
    response_message: >-
      {% if current_cpu_value < cpu_threshold %}
      1. CPU Status: Normal (Below Threshold)
 
      2. CPU Before: {{ current_cpu_value }}%
 
      3. CPU After: NA
 
      4. High CPU Processes: NA
 
      5. Approved Processes: NA
 
      6. Non-Approved Processes: NA
 
      7. Process IDs (PIDs): NA
 
      8. Action Taken: No action was taken because no remediation done
 
      {% elif final_cpu_value < cpu_threshold %}
      1. CPU Status: High CPU utilization detected and successfully reduced after remediation.
 
      2. CPU Usage Before Remediation: {{ current_cpu_value }}%
 
      3. CPU Usage After Remediation: {{ final_cpu_value }}%
 
      4. High CPU Processes Identified: {{ high_cpu_details }}
 
      5. Approved Processes (Eligible for Auto-Remediation): {{ approved_processes }}
 
      6. Non-Approved Processes (No Action Taken): {{ non_approved_processes }}
 
      7. Process IDs (PIDs): {{ pid_details }}
 
      8. Action Taken: {{ action_details }}
 
      {% else %}
      1. CPU Status: High CPU utilization persists even after remediation. Escalation required.
 
      2. CPU Usage Before Remediation: {{ current_cpu_value }}%
 
      3. CPU Usage After Remediation: {{ final_cpu_value }}%
 
      4. High CPU Processes Identified: {{ high_cpu_details }}
 
      5. Approved Processes (Eligible for Auto-Remediation): {{ approved_processes }}
 
      6. Non-Approved Processes (No Action Taken): {{ non_approved_processes }}
 
      7. Process IDs (PIDs): {{ pid_details }}
 
      8. Action Taken: {{ action_details }}
 
      {% endif %}

    # =====================================================
    # DISPLAY
    # =====================================================
    - name: Output
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
