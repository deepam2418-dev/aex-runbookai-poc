# =========================================================
# CPU MONITORING & AUTO REMEDIATION
# =========================================================
- name: CPU Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no
  become: yes

  vars:
    cpu_threshold: "{{ threshold | default(80) }}"

    process_list:
      - dataprocess1
      - dataprocess
      - taniumclient.service
      - ir_agent
      - nxlog
      - mdatp.service

  tasks:

    # =====================================================
    # CHECK CURRENT CPU USAGE
    # =====================================================
    - name: Get current CPU usage
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: current_cpu
      changed_when: false

    - name: Set current CPU value
      set_fact:
        current_cpu_value: "{{ current_cpu.stdout | trim | float | round(2) }}"

    # =====================================================
    # INITIALIZE VARIABLES
    # =====================================================
    - name: Initialize variables
      set_fact:
        filtered_processes: []
        filtered_pids: []
        filtered_names: []
        process_killed: false
        final_cpu_value: "{{ current_cpu_value }}"
        high_cpu_details: "NA"
        pid_details: "NA"
        action_details: "NA"
        approved_processes: "NA"
        non_approved_processes: "NA"

    # =====================================================
    # ONLY EXECUTE BELOW IF CPU HIGH
    # =====================================================

    - name: Get high CPU processes
      shell: |
        ps -eo pid,comm,%cpu --no-headers | awk '$3 > {{ cpu_threshold }} {print $1, $2, $3}'
      register: high_cpu
      changed_when: false
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Prepare high CPU details
      set_fact:
        high_cpu_details: "{{ high_cpu.stdout_lines | join(' | ') }}"
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Filter approved processes
      set_fact:
        filtered_processes: >-
          {{
            high_cpu.stdout_lines
            | map('split')
            | selectattr('1', 'in', process_list)
            | list
          }}
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Extract PIDs
      set_fact:
        filtered_pids: "{{ filtered_processes | map('first') | list }}"
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Extract process names
      set_fact:
        filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Prepare PID details
      set_fact:
        pid_details: "{{ filtered_pids | join(', ') if filtered_pids | length > 0 else 'None' }}"
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Approved processes
      set_fact:
        approved_processes: "{{ filtered_names | unique | join(', ') if filtered_names | length > 0 else 'None' }}"
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Non-approved processes
      set_fact:
        non_approved_processes: >-
          {{
            high_cpu.stdout_lines
            | map('split')
            | map(attribute=1)
            | difference(process_list)
            | unique
            | join(', ')
          }}
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Kill processes
      shell: "kill -9 {{ item }}"
      loop: "{{ filtered_pids }}"
      register: kill_results
      ignore_errors: yes
      when:
        - current_cpu_value | float >= cpu_threshold | float
        - filtered_pids | length > 0

    - name: Action details
      set_fact:
        action_details: >-
          {% if filtered_pids | length > 0 %}
          Killed processes: {{ filtered_pids | join(', ') }}
          {% else %}
          No approved processes found for termination
          {% endif %}
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Restart dataprocess
      shell: nohup /home/svc_agenticai@ivhinc.com/script/dataprocess1.sh &
      when:
        - current_cpu_value | float >= cpu_threshold | float
        - filtered_pids | length > 0

    - name: Mark remediation
      set_fact:
        process_killed: true
      when:
        - current_cpu_value | float >= cpu_threshold | float
        - filtered_pids | length > 0

    - name: Wait
      pause:
        seconds: 10
      when: process_killed | bool

    - name: Recheck CPU
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: cpu_usage
      changed_when: false
      when: process_killed | bool

    - name: Set final CPU
      set_fact:
        final_cpu_value: "{{ cpu_usage.stdout | trim | float | round(2) }}"
      when: process_killed | bool

    # =====================================================
    # STATUS CODE
    # =====================================================
    - name: Set status
      set_fact:
        status_code: >-
          {{
            0 if current_cpu_value | float < cpu_threshold | float
            else (1 if final_cpu_value | float < cpu_threshold | float else 2)
          }}

    # =====================================================
    # FINAL RESPONSE (UPDATED)
    # =====================================================
    - name: Set response message
      set_fact:
        response_message: >-
          {% if current_cpu_value | float < cpu_threshold | float %}

          CPU Usage is within limit ({{ cpu_threshold }}%).
          Current CPU: {{ current_cpu_value }}%
          No remediation required.

          {% else %}

          1. CPU Status: {{ 'Recovered after remediation' if final_cpu_value < cpu_threshold else 'Still High - Escalation Required' }}

          2. CPU Before: {{ current_cpu_value }}%

          3. CPU After: {{ final_cpu_value }}%

          4. High CPU Processes: {{ high_cpu_details }}

          5. Approved Processes: {{ approved_processes }}

          6. Non-Approved Processes: {{ non_approved_processes }}

          7. Process IDs (PIDs): {{ pid_details }}

          8. Action Taken: {{ action_details }}

          {% endif %}

    # =====================================================
    # OUTPUT
    # =====================================================
    - name: Output
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
