# =========================================================
# CPU MONITORING & AUTO REMEDIATION
# =========================================================
- name: CPU Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no
  become: yes

  vars:
    cpu_threshold: "{{ threshold | default(80) }}"

    process_list:
      - dataprocess1
      - dataprocess
      - taniumclient.service
      - ir_agent
      - nxlog
      - mdatp.service

  tasks:

    # =====================================================
    # GET CURRENT CPU
    # =====================================================
    - name: Get current CPU usage
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: current_cpu
      changed_when: false

    - name: Set current CPU value
      set_fact:
        current_cpu_value: "{{ current_cpu.stdout | trim | float | round(2) }}"

    # =====================================================
    # INITIAL DEFAULT VALUES (NA)
    # =====================================================
    - name: Initialize defaults
      set_fact:
        final_cpu_value: "NA"
        high_cpu_details: "NA"
        approved_processes: "NA"
        non_approved_processes: "NA"
        pid_details: "NA"
        action_details: ""
        filtered_pids: []

    # =====================================================
    # WHEN CPU IS HIGH
    # =====================================================
    - name: Get high CPU processes
      shell: |
        ps -eo pid,comm,%cpu --no-headers | awk '$3 > {{ cpu_threshold }} {print $1, $2, $3}'
      register: high_cpu
      changed_when: false
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Prepare high CPU details
      set_fact:
        high_cpu_details: "{{ high_cpu.stdout_lines | join(' | ') }}"
      when:
        - current_cpu_value | float >= cpu_threshold | float
        - high_cpu.stdout_lines | length > 0

    # =====================================================
    # FILTER APPROVED
    # =====================================================
    - name: Filter approved processes
      set_fact:
        filtered_processes: >-
          {{
            high_cpu.stdout_lines
            | map('split')
            | selectattr('1', 'in', process_list)
            | list
          }}
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Extract PIDs
      set_fact:
        filtered_pids: "{{ filtered_processes | map('first') | list }}"
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Extract names
      set_fact:
        filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"
      when: current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # CLASSIFICATION
    # =====================================================
    - name: Approved processes
      set_fact:
        approved_processes: "{{ filtered_names | unique | join(', ') if filtered_names | length > 0 else 'None' }}"
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Non-approved processes
      set_fact:
        non_approved_processes: >-
          {{
            high_cpu.stdout_lines
            | map('split')
            | map(attribute=1)
            | difference(process_list)
            | unique
            | join(', ')
            if high_cpu.stdout_lines | length > 0 else 'None'
          }}
      when: current_cpu_value | float >= cpu_threshold | float

    - name: PID details
      set_fact:
        pid_details: "{{ filtered_pids | join(', ') if filtered_pids | length > 0 else 'None' }}"
      when: current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # KILL
    # =====================================================
    - name: Kill approved processes
      shell: "kill -9 {{ item }}"
      loop: "{{ filtered_pids }}"
      ignore_errors: yes
      when:
        - current_cpu_value | float >= cpu_threshold | float
        - filtered_pids | length > 0

    # =====================================================
    # ACTION MESSAGE
    # =====================================================
    - name: Set action details
      set_fact:
        action_details: >-
          {% if current_cpu_value | float < cpu_threshold | float %}
          CPU Utilization is within acceptable threshold. No remediation required.
          {% elif filtered_pids | length > 0 %}
          Approved process PIDs {{ filtered_pids | join(', ') }} were terminated successfully.
          {% else %}
          No approved process found. High CPU caused by non-approved processes.
          {% endif %}

    # =====================================================
    # RESTART
    # =====================================================
    - name: Restart dataprocess
      shell: nohup /home/svc_agenticai@ivhinc.com/script/dataprocess1.sh &
      when:
        - current_cpu_value | float >= cpu_threshold | float
        - filtered_pids | length > 0

    # =====================================================
    # WAIT
    # =====================================================
    - name: Wait
      pause:
        seconds: 10
      when: current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # RECHECK CPU
    # =====================================================
    - name: Get CPU after remediation
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: cpu_usage
      changed_when: false
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Set final CPU
      set_fact:
        final_cpu_value: "{{ cpu_usage.stdout | trim | float | round(2) }}"
      when: current_cpu_value | float >= cpu_threshold | float

    # =====================================================
    # STATUS CODE (FIXED)
    # =====================================================
    - name: Set status
      set_fact:
        status_code: >-
          {{
            1 if ((current_cpu_value < cpu_threshold) or (final_cpu_value | float < cpu_threshold))
            else 2
          }}

    # =====================================================
    # FINAL MESSAGE
    # =====================================================
    - name: Set response
      set_fact:
        response_message: >-
          {% if current_cpu_value | float < cpu_threshold | float %}
          1. CPU Status: CPU Utilization is within acceptable threshold. No remediation required.

          2. CPU Usage Before Remediation: {{ current_cpu_value }}%

          3. CPU Usage After Remediation: NA

          4. High CPU Processes: NA

          5. Approved Processes: NA

          6. Non-Approved Processes: NA

          7. Process IDs (PIDs): NA

          8. Action Taken: CPU Utilization is within acceptable threshold. No remediation required.

          {% else %}
          1. CPU Status: {% if final_cpu_value | float < cpu_threshold %}SUCCESS - CPU issue resolved{% else %}FAILED - CPU still high{% endif %}

          2. CPU Usage Before Remediation: {{ current_cpu_value }}%

          3. CPU Usage After Remediation: {{ final_cpu_value }}%

          4. High CPU Processes: {{ high_cpu_details }}

          5. Approved Processes: {{ approved_processes }}

          6. Non-Approved Processes: {{ non_approved_processes }}

          7. Process IDs (PIDs): {{ pid_details }}

          8. Action Taken: {{ action_details }}
          {% endif %}

    # =====================================================
    # OUTPUT
    # =====================================================
    - name: Output
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
