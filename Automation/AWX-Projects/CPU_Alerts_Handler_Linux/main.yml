# =========================================================
# CPU MONITORING & AUTO REMEDIATION
# =========================================================
- name: CPU Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no
  become: yes

  vars:
    cpu_threshold: "{{ threshold | default(80) }}"

    process_list:
      - dataprocess1
      - dataprocess
      - taniumclient.service
      - ir_agent
      - nxlog
      - mdatp.service

  tasks:

    - name: Get current CPU usage
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: current_cpu
      changed_when: false

    - name: Set current CPU value
      set_fact:
        current_cpu_value: "{{ current_cpu.stdout | trim | float | round(2) }}"

    - name: Initialize variables
      set_fact:
        filtered_processes: []
        filtered_pids: []
        filtered_names: []
        process_killed: false
        final_cpu_value: "{{ current_cpu_value }}"
        high_cpu_details: "NA"
        pid_details: "NA"
        action_details: "NA"
        approved_processes: "NA"
        non_approved_processes: "NA"

    - name: Get high CPU processes
      shell: |
        ps -eo pid,comm,%cpu --no-headers | awk '$3 > {{ cpu_threshold }} {print $1, $2, $3}'
      register: high_cpu
      changed_when: false
      when: current_cpu_value | float >= cpu_threshold | float

    - name: Set high CPU details
      set_fact:
        high_cpu_details: "{{ high_cpu.stdout_lines | join(' | ') }}"
      when:
        - high_cpu.stdout_lines is defined
        - high_cpu.stdout_lines | length > 0

    - name: Filter approved processes
      set_fact:
        filtered_processes: "{{ high_cpu.stdout_lines | map('split') | selectattr('1', 'in', process_list) | list }}"
      when:
        - high_cpu.stdout_lines is defined

    - name: Extract PIDs
      set_fact:
        filtered_pids: "{{ filtered_processes | map('first') | list }}"
      when:
        - filtered_processes | length > 0

    - name: Extract names
      set_fact:
        filtered_names: "{{ filtered_processes | map(attribute='1') | list }}"
      when:
        - filtered_processes | length > 0

    - name: PID details
      set_fact:
        pid_details: "{{ filtered_pids | join(', ') }}"
      when:
        - filtered_pids | length > 0

    - name: Approved processes
      set_fact:
        approved_processes: "{{ filtered_names | unique | join(', ') }}"
      when:
        - filtered_names | length > 0

    - name: Non-approved processes
      set_fact:
        non_approved_processes: "{{ high_cpu.stdout_lines | map('split') | map(attribute=1) | difference(process_list) | unique | join(', ') }}"
      when:
        - high_cpu.stdout_lines is defined
        - high_cpu.stdout_lines | length > 0

    - name: Kill processes
      shell: "kill -9 {{ item }}"
      loop: "{{ filtered_pids }}"
      ignore_errors: yes
      when:
        - filtered_pids | length > 0

    - name: Action details
      set_fact:
        action_details: >-
          {% if filtered_pids | length > 0 %}
          Killed processes: {{ filtered_pids | join(', ') }}
          {% else %}
          NA
          {% endif %}

    - name: Restart service
      shell: nohup /home/svc_agenticai@ivhinc.com/script/dataprocess1.sh &
      when:
        - filtered_pids | length > 0

    - name: Set remediation flag
      set_fact:
        process_killed: true
      when:
        - filtered_pids | length > 0

    - name: Wait
      pause:
        seconds: 10
      when:
        - process_killed

    - name: Get CPU after remediation
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print 100 - $8}'"
      register: cpu_usage
      changed_when: false
      when:
        - process_killed

    - name: Set final CPU
      set_fact:
        final_cpu_value: "{{ cpu_usage.stdout | trim | float | round(2) }}"
      when:
        - process_killed

    - name: Status code
      set_fact:
        status_code: "{{ 1 if final_cpu_value | float < cpu_threshold | float else 2 }}"

    - name: Build response
      set_fact:
        response_message: >-
          1. Hostname: {{ inventory_hostname }}

          {% if current_cpu_value | float < cpu_threshold | float %}
          2. CPU Status: CPU within threshold. No remediation required.
          {% elif final_cpu_value | float < cpu_threshold | float %}
          2. CPU Status: CPU normalized after remediation.
          {% else %}
          2. CPU Status: CPU still high. Escalation required.
          {% endif %}

          3. CPU Before: {{ current_cpu_value }}%
          4. CPU After: {{ final_cpu_value }}%
          5. High CPU Processes: {{ high_cpu_details }}
          6. Approved: {{ approved_processes }}
          7. Non-Approved: {{ non_approved_processes }}
          8. PIDs: {{ pid_details }}
          9. Action: {{ action_details }}

    - name: Output
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"
