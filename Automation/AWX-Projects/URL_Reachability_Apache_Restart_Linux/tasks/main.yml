---
- name: Check URL reachability via ICMP ping and restart Apache if needed
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    # Dynamic parameters
    check_url: "{{ check_url }}"        # e.g., https://example.com/app
    ping_count: "{{ ping_count | default(3) }}"
    ping_timeout: "{{ ping_timeout | default(2) }}"

    # Result variables
    status_code: 2                      # 1 = success, 2 = failure (default to failure)
    response_message: ""

  tasks:
    - name: Validate that check_url is provided
      fail:
        msg: "The 'check_url' variable is required."
      when: check_url is not defined or check_url | trim == ""

    - name: Extract hostname from URL
      vars:
        # Basic regex to extract hostname from URL
        url_regex: '^(?:[a-zA-Z][a-zA-Z0-9+.-]*://)?([^/ :]+)'
      set_fact:
        url_hostname: "{{ (check_url | regex_search(url_regex, '\\1')) | default('', true) }}"
      failed_when: false

    - name: Fail if hostname could not be extracted
      fail:
        msg: "Unable to extract hostname from URL '{{ check_url }}'. Please provide a valid URL (e.g., https://example.com/app)."
      when: url_hostname is not defined or url_hostname | trim == ""

    - name: Perform ICMP ping to the hostname
      ansible.builtin.command: >
        ping -c {{ ping_count }} -W {{ ping_timeout }} {{ url_hostname }}
      register: ping_result
      changed_when: false
      failed_when: false

    - name: Determine if host is reachable
      set_fact:
        host_reachable: "{{ (ping_result.rc == 0) }}"

    - name: Check if httpd service unit exists
      ansible.builtin.shell: |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl list-unit-files | awk '{print $1}' | grep -E '^httpd\\.service$' || true
        else
          # Fallback check for non-systemd systems
          if service httpd status >/dev/null 2>&1; then
            echo "httpd.service"
          fi
        fi
      register: httpd_check
      changed_when: false
      failed_when: false

    - name: Check if apache2 service unit exists
      ansible.builtin.shell: |
        if command -v systemctl >/dev/null 2>&1; then
          systemctl list-unit-files | awk '{print $1}' | grep -E '^apache2\\.service$' || true
        else
          # Fallback check for non-systemd systems
          if service apache2 status >/dev/null 2>&1; then
            echo "apache2.service"
          fi
        fi
      register: apache2_check
      changed_when: false
      failed_when: false

    - name: Decide Apache service name
      set_fact:
        apache_service_name: >-
          {% if (httpd_check.stdout | trim) != '' %}
            httpd
          {% elif (apache2_check.stdout | trim) != '' %}
            apache2
          {% else %}
            ""
          {% endif %}

    - name: Fail if no Apache service is detected
      fail:
        msg: "Neither 'httpd' nor 'apache2' service is available on this host. Cannot restart Apache."
      when: apache_service_name | trim == ""

    - name: Restart Apache service if host is NOT reachable
      ansible.builtin.service:
        name: "{{ apache_service_name }}"
        state: restarted
      register: apache_restart_result
      when: not host_reachable
      failed_when: apache_restart_result is failed
      ignore_errors: false

    - name: Set result for reachable host (no restart required)
      set_fact:
        status_code: 1
        response_message: >-
          Host '{{ url_hostname }}' derived from URL '{{ check_url }}'
          is reachable via ICMP ping. Apache service '{{ apache_service_name }}'
          was not restarted.
      when: host_reachable

    - name: Set result for unreachable host and successful restart
      set_fact:
        status_code: 1
        response_message: >-
          Host '{{ url_hostname }}' derived from URL '{{ check_url }}'
          is NOT reachable via ICMP ping (ping rc={{ ping_result.rc }}).
          Apache service '{{ apache_service_name }}' was restarted successfully.
      when:
        - not host_reachable
        - apache_restart_result is defined
        - apache_restart_result is succeeded

    - name: Set result for unreachable host and failed restart
      set_fact:
        status_code: 2
        response_message: >-
          Host '{{ url_hostname }}' derived from URL '{{ check_url }}'
          is NOT reachable via ICMP ping (ping rc={{ ping_result.rc }}),
          and Apache service '{{ apache_service_name }}' failed to restart.
          Error: {{ apache_restart_result.msg | default('Unknown error') }}
      when:
        - not host_reachable
        - apache_restart_result is defined
        - apache_restart_result is failed

    - name: Final result
      ansible.builtin.debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"