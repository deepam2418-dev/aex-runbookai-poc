---
- name: Get top 3 CPU utilization processes on a Linux machine
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    process_count: 3

  tasks:
    - name: Get top CPU-consuming processes
      shell: |
        ps -eo pid,ppid,cmd,%cpu,%mem --sort=-%cpu | head -n {{ process_count | int + 1 }}
      register: ps_output
      changed_when: false
      failed_when: ps_output.rc != 0

    - name: Set success result
      when: ps_output.rc == 0
      set_fact:
        status_code: 1
        response_message: >
          Successfully fetched top {{ process_count }} CPU utilization processes.
          Output:
          {{ ps_output.stdout }}

    - name: Set failure result
      when: ps_output.rc != 0
      set_fact:
        status_code: 2
        response_message: >
          Failed to fetch top CPU utilization processes.
          Error:
          {{ ps_output.stderr }}

    - name: Show final result
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"