---
- name: Get top 2 highest CPU utilization processes on a Windows machine
  hosts: "{{ target_host }}"
  gather_facts: no
  vars:
    status_code: 0
    response_message: ""

  tasks:
    - name: Get top 2 CPU utilization processes via PowerShell
      win_shell: |
        $procs = Get-Process | Sort-Object -Property CPU -Descending | Select-Object -First 2
        $result = $procs | Select-Object Name, Id, CPU | ConvertTo-Json -Depth 3
        Write-Output $result
      register: process_info
      failed_when: process_info.rc != 0

    - name: Set success status and response message
      set_fact:
        status_code: 1
        response_message: >-
          Top 2 CPU utilization processes:
          {{ process_info.stdout }}
      when: process_info.rc == 0

    - name: Set failure status and response message
      set_fact:
        status_code: 2
        response_message: >-
          Failed to retrieve top CPU processes. Error:
          {{ process_info.stderr if process_info.stderr is defined else process_info.stdout }}
      when: process_info.rc != 0

    - name: Display final status and response
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"