---
- name: Filesystem_Details_Collector_Linux
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    # Mandatory status initialization
    status_code: 0
    response_message: "Automation execution is in progress."

  tasks:
    - name: Run pre execution lifecycle role
      ansible.builtin.include_role:
        name: Job_Pre_Execution
      vars:
        status_code: "{{ status_code }}"
        response_message: "{{ response_message }}"

    - name: Main automation block
      block:
        - name: Validate required parameters
          ansible.builtin.assert:
            that:
              - target_host is defined
              - target_host | string | length > 0
            fail_msg: "Required parameter 'target_host' is missing or empty."
            success_msg: "Required parameters validated successfully."

        - name: Update job status - parameter validation completed
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Parameter validation completed successfully. Automation is in progress."

        - name: Collect filesystem details for /tmp
          ansible.builtin.command: df -h /tmp
          register: df_tmp
          changed_when: false

        - name: Update job status - filesystem details collected
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Filesystem details for /tmp collected successfully. Automation is still in progress."

        - name: Collect detailed stat information for /tmp
          ansible.builtin.stat:
            path: /tmp
          register: tmp_stat

        - name: Update job status - directory stat details collected
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: 0
            response_message: "Directory stat details for /tmp collected successfully. Preparing final status."

        - name: Prepare summarized output for /tmp filesystem
          ansible.builtin.set_fact:
            filesystem_details_output: >
              Filesystem details for /tmp:
              {{ '\n' }}--- df -h /tmp output ---
              {{ '\n' }}{{ df_tmp.stdout }}
              {{ '\n\n' }}--- /tmp stat details ---
              {{ '\n' }}Owner: {{ tmp_stat.stat.pw_name | default('unknown') }}
              {{ '\n' }}Group: {{ tmp_stat.stat.gr_name | default('unknown') }}
              {{ '\n' }}Mode: {{ tmp_stat.stat.mode | string }}
              {{ '\n' }}Permissions: {{ '%04o' | format(tmp_stat.stat.mode | int) }}
              {{ '\n' }}Is directory: {{ tmp_stat.stat.isdir }}
              {{ '\n' }}Is mount: {{ tmp_stat.stat.ismount | default(false) }}
              {{ '\n' }}Filesystem device: {{ tmp_stat.stat.dev | default('unknown') }}

        - name: Display collected filesystem details
          ansible.builtin.debug:
            msg: "{{ filesystem_details_output }}"

        - name: Set successful resolution status
          ansible.builtin.set_fact:
            status_code: 1
            response_message: "Automation completed successfully. Filesystem details for /tmp have been collected."

        - name: Update job status - successfully resolved
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      rescue:
        - name: Set failed and transferred status
          ansible.builtin.set_fact:
            status_code: -1
            response_message: "Automation execution was not successful. The issue is being transferred for manual review."

        - name: Update job status - execution not successful and transferred
          ansible.builtin.include_role:
            name: Job_Updates
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"

      always:
        - name: Run post execution lifecycle role
          ansible.builtin.include_role:
            name: Job_Post_Execution
          vars:
            status_code: "{{ status_code }}"
            response_message: "{{ response_message }}"