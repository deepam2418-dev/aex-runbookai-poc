--- 
- name: Windows Filesystem Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no

  vars:
    filesystem_threshold: "{{ threshold | default(80) }}"
    allowed_cleanup_dirs:
      - "C:\\temp\\fstest"
      - "C:\\Windows\\Temp"
    cleanup_pattern:
      - "*.bin"
      - "*.tmp"
      - "*.md"

  tasks:

    # =====================================================
    # FETCH CURRENT FILESYSTEM USAGE
    # =====================================================
    - name: Fetch highest filesystem usage
      win_shell: |
        $drives = Get-WmiObject Win32_LogicalDisk -Filter "DriveType=3"
        $maxUsage = 0
        foreach ($drive in $drives) {
          if ($drive.Size -gt 0) {
            $usage = [math]::Round((($drive.Size - $drive.FreeSpace) / $drive.Size) * 100, 2)
            if ($usage -gt $maxUsage) {
              $maxUsage = $usage
            }
          }
        }
        Write-Output $maxUsage
      register: fs_output
      changed_when: false

    - name: Set filesystem fact
      set_fact:
        filesystem_usage: "{{ fs_output.stdout | trim | float }}"

    # =====================================================
    # FIND FILES FOR CLEANUP
    # =====================================================
    - name: Find files eligible for cleanup
      win_find:
        paths: "{{ allowed_cleanup_dirs }}"
        patterns: "{{ cleanup_pattern }}"
        recurse: yes
        file_type: file
      register: files_to_delete
      # when: filesystem_usage > filesystem_threshold

    - debug:
        msg: "{{ files_to_delete.files | map(attribute='path') | join('|') | regex_replace('\\\\','/') }}"

    - meta: end_play

    # =====================================================
    # DELETE FILES
    # =====================================================
    - name: Delete eligible files
      win_file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ files_to_delete.files }}"
      register: delete_output
      when:
        - filesystem_usage > filesystem_threshold
        - files_to_delete.files | length > 0

    # =====================================================
    # SET CLEANUP STATUS
    # =====================================================
    - name: Set cleanup performed
      set_fact:
        cleanup_performed: true
      when: delete_output is defined

    - name: Set cleanup skipped
      set_fact:
        cleanup_performed: false
      when: cleanup_performed is not defined

    # =====================================================
    # WAIT AFTER CLEANUP
    # =====================================================
    - name: Wait after cleanup
      pause:
        seconds: 10
      when: cleanup_performed | bool

    # =====================================================
    # RECHECK FILESYSTEM USAGE
    # =====================================================
    - name: Recheck filesystem usage
      win_shell: |
        $drives = Get-WmiObject Win32_LogicalDisk -Filter "DriveType=3"
        $maxUsage = 0
        foreach ($drive in $drives) {
          if ($drive.Size -gt 0) {
            $usage = [math]::Round((($drive.Size - $drive.FreeSpace) / $drive.Size) * 100, 2)
            if ($usage -gt $maxUsage) {
              $maxUsage = $usage
            }
          }
        }
        Write-Output $maxUsage
      register: fs_after
      changed_when: false
      when: cleanup_performed | bool

    - name: Set final filesystem usage
      set_fact:
        final_filesystem_usage: "{{ fs_after.stdout | trim | float }}"
      when: cleanup_performed | bool

    - name: Set fallback filesystem usage
      set_fact:
        final_filesystem_usage: "{{ filesystem_usage }}"
      when: final_filesystem_usage is not defined

    # =====================================================
    # FINAL STATUS (SNOW SAFE ✅)
    # =====================================================
    - name: Set final response
      set_fact:
        status_code: >-
          {{
            1 if (final_filesystem_usage | float) < (filesystem_threshold | float)
            else 2
          }}
        response_message: |
          {% if filesystem_usage | float < filesystem_threshold | float %}
          Current Filesystem utilization is {{ filesystem_usage }}%, within threshold {{ filesystem_threshold }}%.
          No action required.
          {% else %}

          {% if final_filesystem_usage | float < filesystem_threshold | float %}
          Filesystem Status: Issue Resolved After Remediation
          {% else %}
          Filesystem Status: Still High - Escalation Required
          {% endif %}

          Filesystem Usage Before Remediation: {{ filesystem_usage }}%
          Filesystem Usage After Remediation: {{ final_filesystem_usage }}%

          Files Identified For Cleanup:
          {% if files_to_delete is defined and files_to_delete.files | length > 0 %}
          {% for file in files_to_delete.files %}
          - {{ file.path | regex_replace('\\\\', '\\\\\\\\') }}
          {% endfor %}
          {% else %}
          - None
          {% endif %}

          Action Taken:
          {% if cleanup_performed | bool %}
          Cleanup executed for eligible files.
          {% else %}
          No eligible files found for cleanup.
          {% endif %}

          {% endif %}

    - name: Display final response
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"

