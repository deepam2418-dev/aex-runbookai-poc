- name: Windows Filesystem Monitoring and Auto Remediation
  hosts: "{{ hostname }}"
  gather_facts: no

  vars:
    filesystem_threshold: "{{ threshold | default(80) }}"

    allowed_cleanup_dirs:
      - "C:\\temp\\fstest"
      - "C:\\Windows\\Temp"

    cleanup_pattern:
      - "*.bin"
      - "*.tmp"
      - "*.md"

  tasks:

    # Fetch filesystem usage
    - name: Fetch highest filesystem usage
      win_shell: |
        $drives = Get-WmiObject Win32_LogicalDisk -Filter "DriveType=3"
        $maxUsage = 0

        foreach ($drive in $drives) {
          if ($drive.Size -gt 0) {
            $usage = [math]::Round(((($drive.Size - $drive.FreeSpace) / $drive.Size) * 100), 2)
            if ($usage -gt $maxUsage) {
              $maxUsage = $usage
            }
          }
        }

        Write-Output $maxUsage
      register: fs_output
      changed_when: false

    - name: Set filesystem fact
      set_fact:
        filesystem_usage: "{{ fs_output.stdout | trim | float }}"

    # Get exceeded FS
    - name: Get filesystems exceeding threshold
      win_shell: |
        $threshold = {{ filesystem_threshold }}

        Get-WmiObject Win32_LogicalDisk -Filter "DriveType=3" |
        ForEach-Object {
          if ($_.Size -gt 0) {
            $usage = [math]::Round(((($_.Size - $_.FreeSpace) / $_.Size) * 100), 2)
            if ($usage -gt $threshold) {
              Write-Output "$($_.DeviceID) $usage%"
            }
          }
        }
      register: exceeded_fs
      changed_when: false
      when: filesystem_usage > filesystem_threshold

    # Find files
    - name: Find files for cleanup
      win_find:
        paths: "{{ allowed_cleanup_dirs }}"
        patterns: "{{ cleanup_pattern }}"
        recurse: yes
      register: files_to_delete
      when: filesystem_usage > filesystem_threshold

    # Delete files
    - name: Delete files
      win_file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ files_to_delete.files }}"
      register: delete_output
      when:
        - filesystem_usage > filesystem_threshold
        - files_to_delete.files | length > 0

    # Cleanup status
    - set_fact:
        cleanup_performed: true
      when: delete_output is defined

    - set_fact:
        cleanup_performed: false
      when: cleanup_performed is not defined

    # Wait
    - pause:
        seconds: 10
      when: cleanup_performed

    # Recheck usage
    - name: Recheck filesystem usage
      win_shell: |
        $drives = Get-WmiObject Win32_LogicalDisk -Filter "DriveType=3"
        $maxUsage = 0

        foreach ($drive in $drives) {
          if ($drive.Size -gt 0) {
            $usage = [math]::Round(((($drive.Size - $drive.FreeSpace) / $drive.Size) * 100), 2)
            if ($usage -gt $maxUsage) {
              $maxUsage = $usage
            }
          }
        }

        Write-Output $maxUsage
      register: fs_after
      changed_when: false
      when: cleanup_performed

    - set_fact:
        final_filesystem_usage: "{{ fs_after.stdout | trim | float }}"
      when: cleanup_performed

    - set_fact:
        final_filesystem_usage: "{{ filesystem_usage }}"
      when: final_filesystem_usage is not defined

    # Final response
    - name: Set final response
      set_fact:
        status_code: >-
          {{
            1 if (final_filesystem_usage | float) < (filesystem_threshold | float)
            else 2
          }}

        response_message: |
          {% if filesystem_usage | float < filesystem_threshold | float %}
          Filesystem within limit.
          Current Usage: {{ filesystem_usage }}%
          No remediation required.
          {% else %}

          {% if final_filesystem_usage | float < filesystem_threshold | float %}
          Filesystem Status:  Resolved After Cleanup
          {% else %}
          Filesystem Status:  Still High - Escalation Required
          {% endif %}

          Usage Before: {{ filesystem_usage }}%
          Usage After: {{ final_filesystem_usage }}%

          Files Cleaned:
          {{ files_to_delete.files | map(attribute='path') | join(' | ') if (files_to_delete is defined and files_to_delete.files | length > 0) else 'None' }}

          Action Taken:
          {% if cleanup_performed %}
          Cleanup executed successfully
          {% else %}
          No files found for cleanup
          {% endif %}

          {% endif %}

    # Display
    - debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"

    # API update
    - name: Update iautomate
      uri:
        url: "http://10.224.11.147:8080/v2/runbooks/orgentityid/1/updaterunbookstatusv2"
        method: PUT
        user: "{{ iautomate_user }}"
        password: "{{ iautomate_pass }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
        body_format: json
        body: "{{ lookup('template','status.json.j2') }}"
      delegate_to: localhost
