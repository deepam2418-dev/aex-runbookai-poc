---
- name: Restart Apache service if URL is not reachable
  hosts: "{{ target_host }}"
  gather_facts: false
  vars:
    status_code: 0
    response_message: ""
    check_url: "{{ check_url }}"
    apache_service_name: "{{ apache_service_name }}"

  tasks:
    - name: Validate required parameters
      assert:
        that:
          - check_url is defined
          - check_url | length > 0
          - apache_service_name is defined
          - apache_service_name | length > 0
        fail_msg: "Missing required parameters: check_url and apache_service_name must be provided."
        success_msg: "All required parameters are provided."

    - name: Check URL reachability
      uri:
        url: "{{ check_url }}"
        method: GET
        status_code: 200,301,302
        return_content: no
        validate_certs: yes
      register: url_check_result
      failed_when: false

    - name: Decide if Apache restart is needed based on URL check
      set_fact:
        restart_required: "{{ (url_check_result is failed) or (url_check_result.status is not defined) or (url_check_result.status | int not in [200, 301, 302]) }}"

    - name: Log URL check outcome
      debug:
        msg: >
          URL check for {{ check_url }}:
          status={{ url_check_result.status | default('unknown') }},
          failed={{ url_check_result is failed }},
          restart_required={{ restart_required }}

    - name: Restart Apache service when URL is not reachable
      service:
        name: "{{ apache_service_name }}"
        state: restarted
      when: restart_required | bool
      register: apache_restart_result
      failed_when: apache_restart_result is failed

    - name: Set result when restart performed successfully
      when: restart_required | bool and (apache_restart_result is succeeded)
      set_fact:
        status_code: 1
        response_message: >-
          URL {{ check_url }} was not reachable. Apache service '{{ apache_service_name }}'
          has been restarted successfully on host '{{ inventory_hostname }}'.

    - name: Set result when restart failed
      when: restart_required | bool and (apache_restart_result is failed)
      set_fact:
        status_code: 2
        response_message: >-
          URL {{ check_url }} was not reachable. Attempt to restart Apache service
          '{{ apache_service_name }}' on host '{{ inventory_hostname }}' failed:
          {{ apache_restart_result.msg | default('Unknown error') }}.

    - name: Set result when no restart was required (URL reachable)
      when: not restart_required | bool
      set_fact:
        status_code: 1
        response_message: >-
          URL {{ check_url }} is reachable (HTTP status {{ url_check_result.status | default('unknown') }}).
          Apache service '{{ apache_service_name }}' was not restarted on host '{{ inventory_hostname }}'.

    - name: Final output
      debug:
        msg:
          status_code: "{{ status_code }}"
          response_message: "{{ response_message }}"