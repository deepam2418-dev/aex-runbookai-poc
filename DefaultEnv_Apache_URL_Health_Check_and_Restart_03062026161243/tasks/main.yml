---
- name: Restart Apache service in Linux if URL is not reachable
  hosts: "{{ target_host }}"
  gather_facts: yes
  vars:
    check_url: "{{ check_url }}"
    apache_service_name: "{{ apache_service_name }}"
  tasks:
    - name: Validate required parameters
      assert:
        that:
          - check_url is defined
          - apache_service_name is defined
          - target_host is defined
        fail_msg: "Missing required parameters: check_url, apache_service_name, and target_host must all be provided."
        success_msg: "All required parameters are defined."

    - name: Check application URL reachability
      uri:
        url: "{{ check_url }}"
        method: GET
        return_content: no
        validate_certs: no
        status_code: 200,301,302
      register: url_check_result
      failed_when: false

    - name: Set flag if URL is not reachable
      set_fact:
        url_not_reachable: "{{ (url_check_result is failed) or (url_check_result.status | default(0) not in [200, 301, 302]) }}"

    - name: Debug URL check result
      debug:
        msg:
          - "URL checked: {{ check_url }}"
          - "HTTP status: {{ url_check_result.status | default('no_status') }}"
          - "URL not reachable flag: {{ url_not_reachable }}"

    - name: Restart Apache service if URL is not reachable
      service:
        name: "{{ apache_service_name }}"
        state: restarted
      when: url_not_reachable | bool
      register: apache_restart_result
      failed_when: apache_restart_result is failed

    - name: Set result for no action required when URL reachable
      set_fact:
        apache_restart_result:
          changed: false
          msg: "URL is reachable. Apache restart not required."
      when: not url_not_reachable | bool and (apache_restart_result is not defined)

    - name: Prepare final status variables
      set_fact:
        status_code: >-
          {% if not url_not_reachable | bool %}
          1
          {% elif url_not_reachable | bool and (apache_restart_result is defined and not (apache_restart_result is failed)) %}
          1
          {% else %}
          2
          {% endif %}
        response_message: >-
          {% if not url_not_reachable | bool %}
          URL {{ check_url }} is reachable. Apache service restart was not required. (status_code=1)
          {% elif url_not_reachable | bool and (apache_restart_result is defined and not (apache_restart_result is failed)) %}
          URL {{ check_url }} was not reachable. Apache service '{{ apache_service_name }}' has been restarted successfully. (status_code=1)
          {% else %}
          URL {{ check_url }} was not reachable, and restarting Apache service '{{ apache_service_name }}' failed. (status_code=2)
          {% endif %}

    - name: Show final result
      debug:
        msg:
          - "status_code: {{ status_code }}"
          - "response_message: {{ response_message }}"